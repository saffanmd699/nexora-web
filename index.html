<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#f0f2f5;
    color:#1c1e21;
}

button{
    cursor:pointer;
}

#homeSection{
    display:none;
    min-height:100vh;
    background:#f0f2f5;
    padding-bottom:75px;
    overflow-x:hidden;
}

/* ================= LOGIN ================= */

#loginSection{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:25px;
    background:#f0f2f5;
}

.login-box{
    width:100%;
    max-width:400px;
}

.logo{
    width:150px;
    height:55px;
    margin:0 auto 20px;
    background:linear-gradient(135deg,#1877f2,#4f46e5);
    color:white;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;
    box-shadow:0 5px 15px rgba(24,119,242,.25);
}

#loginSection h2{
    text-align:center;
    font-size:24px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#65676b;
    margin-bottom:20px;
}

#loginSection button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#message{
    margin-top:15px;
    text-align:center;
    color:#1877f2;
}

#message.error{
    color:#e41e3f;
}

/* ================= HEADER ================= */

.nx-header{
    height:64px;
    width:100%;
    background:rgba(255,255,255,.98);
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 16px;
    border-bottom:1px solid #e5e5e5;
    box-shadow:0 1px 5px rgba(0,0,0,.10);
    position:sticky;
    top:0;
    z-index:1000;
}

.nx-logo{
    color:#1877f2;
    font-size:30px;
    font-weight:800;
    white-space:nowrap;
}

.nx-search{
    height:42px;
    max-width:360px;
    min-width:0;
    flex:1;
    background:#f0f2f5;
    border-radius:24px;
    padding:0 15px;
    color:#65676b;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    box-sizing:border-box;
    overflow:hidden;
    font-size:14px;
    line-height:1.2;
}
.nx-header-buttons{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:9px;
}

.nx-top-btn{
    width:43px;
    height:43px;
    background:#f0f2f5;
    border:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:20px;
    transition:.2s;
}

.nx-top-btn:active{
    transform:scale(.94);
}

.nx-top-btn:hover{
    background:#e4e6eb;
}

.nx-messenger-icon{
    width:29px;
    height:29px;
    border-radius:50%;
    background:linear-gradient(135deg,#00c6ff,#1877f2,#635bff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    transform:rotate(-20deg);
}

.nx-badge{
    position:absolute;
    top:-3px;
    right:-3px;
    min-width:19px;
    height:19px;
    padding:0 4px;
    border-radius:50%;
    background:#e41e3f;
    color:white;
    border:2px solid white;
    font-size:10px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ================= FEED ================= */

.nx-feed{
    width:100%;
    max-width:720px;
    margin:0 auto;
    padding:8px 10px 90px;
}

.nx-card{
    background:white;
    border-radius:16px;
    border:1px solid #e4e6eb;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    margin-bottom:12px;
    padding:14px;
}

/* CREATE */

.nx-mind-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.nx-avatar{
    width:46px;
    height:46px;
    flex-shrink:0;
    border-radius:50%;
    background:linear-gradient(135deg,#1877f2,#6c5ce7);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.nx-mind{
    flex:1;
    height:46px;
    border:1px solid #ddd;
    border-radius:25px;
    background:#f0f2f5;
    padding:12px 18px;
    display:flex;
    align-items:center;
    color:#65676b;
    cursor:pointer;
}

.nx-action-row{
    display:flex;
    border-top:1px solid #e4e6eb;
    margin-top:14px;
    padding-top:9px;
}

.nx-action-row button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 5px;
    font-size:14px;
    font-weight:600;
    border-radius:9px;
}

.nx-action-row button:hover{
    background:#f0f2f5;
}

.nx-action-row button:nth-child(1){color:#e41e3f}
.nx-action-row button:nth-child(2){color:#7b2cff}
.nx-action-row button:nth-child(3){color:#16a34a}

/* ================= STORIES ================= */

.nx-section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.nx-section-title b{
    font-size:20px;
}

.nx-section-title span{
    color:#1877f2;
    font-size:14px;
    font-weight:bold;
}

.nx-stories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
    align-items:flex-start;
}

.nx-stories::-webkit-scrollbar{
    display:none;
}

.nx-story-list{
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin:0 !important;
    padding:0 !important;
    position:relative;
    top:0;
}

.nx-story{
    min-width:108px;
    width:108px;
    height:185px;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    background:#ddd;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    margin:0 !important;
    padding:0 !important;
}

.nx-story img,
.nx-story video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.create-story{
    background:linear-gradient(160deg,#6c8cff,#1877f2);
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding-bottom:15px;
    margin:0 !important;
    top:0 !important;
}

.story-plus{
    width:48px;
    height:48px;
    border-radius:50%;
    background:white;
    color:#1877f2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    margin-bottom:8px;
}
/* ================= HEADINGS ================= */

.nx-section-heading{
    background:white;
    padding:15px 16px;
    border-radius:14px 14px 0 0;
    border-bottom:1px solid #e4e6eb;
    margin:12px 0 0;
    font-size:18px;
}

/* ================= POSTS ================= */

.post{
    background:white;
    border-radius:0 0 15px 15px;
    padding:14px;
    margin-bottom:14px;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.post-user{
    font-size:16px;
    font-weight:700;
    margin-bottom:8px;
}

.post-text{
    font-size:17px;
    line-height:1.55;
    margin-bottom:10px;
    white-space:pre-wrap;
}

.post-media{
    width:100%;
    max-height:600px;
    object-fit:cover;
    border-radius:10px;
    margin-top:10px;
    display:block;
}

.post-actions{
    display:flex;
    border-top:1px solid #e4e6eb;
    margin-top:10px;
    padding-top:7px;
    gap:3px;
}

.post-actions button{
    flex:1;
    border:none;
    background:transparent;
    color:#65676b;
    font-weight:600;
    padding:10px 5px;
    border-radius:8px;
}

.post-actions button:hover{
    background:#f0f2f5;
}

.delete-btn{
    margin-top:10px;
    background:#ffe5e5;
    color:#e41e3f;
    border:none;
    padding:9px 14px;
    border-radius:8px;
}

/* ================= BOTTOM NAV ================= */

.nx-bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    background:rgba(255,255,255,.98);
    border-top:1px solid #ddd;
    box-shadow:0 -2px 10px rgba(0,0,0,.10);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:3000;
}

.nx-bottom-nav button{
    border:none;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    color:#555;
    min-width:55px;
    font-size:20px;
}

.nx-bottom-nav button.active{
    color:#1877f2;
}

.nx-bottom-nav small{
    font-size:11px;
    font-weight:600;
}

.nx-create-button{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#1877f2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    box-shadow:0 3px 10px rgba(24,119,242,.35);
}

/* ================= MOBILE ================= */

@media(max-width:699px){

    .nx-header{
        height:60px;
        padding:0 10px;
        gap:8px;
    }

    .nx-logo{
        font-size:25px;
    }

   

    .nx-header-buttons{
        gap:5px;
    }

    .nx-top-btn{
        width:39px;
        height:39px;
    }

    .nx-feed{
        padding-left:5px;
        padding-right:5px;
    }

    .nx-card{
        border-radius:13px;
    }

    .nx-story{
        min-width:105px;
        width:105px;
        height:178px;
    }

    .post{
        border-radius:13px;
        padding:12px;
    }

    .post-text{
        font-size:16px;
    }

    .nx-bottom-nav{
        height:64px;
    }

    .nx-create-button{
        width:44px;
        height:44px;
    }
}

/* ================= CREATE POST PAGE ================= */

.nx-modal-page{
    position:fixed;
    inset:0;
    background:#f0f2f5;
    z-index:5000;
    overflow-y:auto;
}

.nx-modal-header{
    height:60px;
    background:white;
    display:flex;
    align-items:center;
    padding:0 15px;
    box-shadow:0 1px 5px rgba(0,0,0,.15);
    position:sticky;
    top:0;
    z-index:10;
}

.nx-back-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:#f0f2f5;
    font-size:23px;
}

.nx-create-container{
    max-width:650px;
    margin:15px auto;
    padding:5px 10px 100px;
}

.nx-create-box{
    background:white;
    border-radius:15px;
    padding:15px;
}

.nx-create-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.nx-create-user img,
.nx-create-fallback{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

.nx-create-fallback{
    background:#e4e6eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

#nexoraPostText{
    width:100%;
    min-height:140px;
    margin-top:15px;
    border:none;
    outline:none;
    resize:none;
    font-size:19px;
    padding:15px;
    border-radius:15px;
}

.nx-add-box{
    margin-top:15px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
}

.nx-add-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.nx-add-buttons button{
    border:none;
    background:#f0f2f5;
    padding:11px 13px;
    border-radius:10px;
}

.nx-publish-btn{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:17px;
    font-weight:bold;
}

/* ================= REELS PAGE ================= */

#nexoraReelsPage{
    display:none;
    position:fixed;
    inset:0;
    background:#f0f2f5;
    z-index:4000;
    overflow-y:auto;
    padding-bottom:80px;
}

.reels-container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:10px;
}

.reel-card{
    background:#000;
    margin-bottom:18px;
    border-radius:14px;
    overflow:hidden;
}

.reel-header{
    color:white;
    padding:12px 15px;
    font-size:17px;
    font-weight:bold;
}

.reel-video{
    width:100%;
    max-height:650px;
    display:block;
    background:#000;
    object-fit:contain;
}

.reel-text{
    color:white;
    padding:12px 15px;
    font-size:16px;
}

.reel-actions{
    display:flex;
    gap:10px;
    padding:10px 15px 15px;
}

.reel-actions button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
}

.comment-box{
    margin-top:10px;
    border-top:1px solid #eee;
    padding-top:10px;
}

.comment-input{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:20px;
    outline:none;
}

.comment-submit{
    margin-top:8px;
    padding:8px 16px;
    background:#1877f2;
    color:white;
    border:none;
    border-radius:8px;
}

.comment-item{
    background:#f0f2f5;
    padding:9px 12px;
    margin-top:8px;
    border-radius:10px;
}
/* ================= STORIES CSS START ================= */

/* Story list */
#storiesFeed{
    display:flex;
    gap:10px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:10px 5px;
    scroll-behavior:smooth;
    scrollbar-width:none;
}

#storiesFeed::-webkit-scrollbar{
    display:none;
}

/* Story card */
.nx-story{
    flex:0 0 115px;
    height:190px;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    background:#e4e6eb;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.nx-story-preview{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

.nx-story-preview img,
.nx-story-preview video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* Story profile */
.nx-story-profile{
    position:absolute;
    top:8px;
    left:8px;
    width:38px;
    height:38px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid #1877f2;
    background:#fff;
    z-index:3;
}

.nx-story-profile img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.nx-story-profile-fallback{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    background:#eee;
}

/* Story name */
.nx-story-name{
    position:absolute;
    left:8px;
    right:8px;
    bottom:8px;
    color:#fff;
    font-size:13px;
    font-weight:bold;
    text-shadow:0 1px 4px #000;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    z-index:3;
}

/* ================= FULL SCREEN VIEWER ================= */

.nexora-story-viewer{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
    background:#000;
    z-index:99999;
    overflow:hidden;
}

/* Close button */
.nexora-story-close{
    position:fixed;
    top:15px;
    right:15px;
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:24px;
    z-index:100005;
    cursor:pointer;
}

/* Story scroll */
.nexora-story-scroll{
    width:100%;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    scrollbar-width:none;
}

.nexora-story-scroll::-webkit-scrollbar{
    display:none;
}

/* Full story */
.nexora-story-full{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:100dvh;
    scroll-snap-align:start;
    scroll-snap-stop:always;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
}

/* Story top profile */
.nexora-story-top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    padding:14px 60px 14px 15px;
    z-index:10;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,.65),
        transparent
    );
}

.nexora-story-user{
    display:flex;
    align-items:center;
    gap:10px;
    color:#fff;
}

.nexora-story-user img,
.nexora-story-user-fallback{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #1877f2;
}

.nexora-story-user-fallback{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eee;
    font-size:22px;
}

.nexora-story-time{
    font-size:12px;
    color:#ddd;
    margin-top:2px;
}

/* Story media */
.nexora-story-media-area{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
}

.nexora-story-media{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* Reaction area */
.nexora-story-reactions{
    position:absolute;
    left:10px;
    right:10px;
    bottom:72px;
    z-index:20;
    display:flex;
    justify-content:center;
    gap:7px;
    flex-wrap:wrap;
    padding:7px;
}

.nexora-story-reactions button{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .15s;
}

.nexora-story-reactions button:active{
    transform:scale(1.25);
}

/* Reply box */
.nexora-story-chat{
    position:absolute;
    left:10px;
    right:10px;
    bottom:15px;
    z-index:30;
    display:flex;
    gap:7px;
}

.nexora-story-chat input{
    flex:1;
    height:44px;
    border:1px solid rgba(255,255,255,.4);
    border-radius:24px;
    background:rgba(0,0,0,.55);
    color:#fff;
    padding:0 16px;
    font-size:15px;
    outline:none;
}

.nexora-story-chat input::placeholder{
    color:#ddd;
}

.nexora-story-chat button{
    width:46px;
    height:44px;
    border:none;
    border-radius:50%;
    background:#1877f2;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

/* Mobile */
@media(max-width:600px){

    .nx-story{
        flex-basis:105px;
        height:175px;
    }

    .nexora-story-reactions{
        bottom:70px;
        gap:5px;
    }

    .nexora-story-reactions button{
        width:38px;
        height:38px;
        font-size:20px;
    }

}

/* ================= STORIES CSS END ================= */
/* =====================================================
   NEXORA STORY REACTION ANIMATION
   ===================================================== */

.nexora-reaction-animation{

    position:absolute;

    left:0;
    right:0;
    bottom:0;
    top:0;

    pointer-events:none;

    overflow:hidden;

    z-index:9999;
}


/* =====================================================
   FLOATING REACTION
   ===================================================== */

.nexora-floating-reaction{

    position:absolute;

    bottom:70px;

    transform:
        translate3d(0,0,0)
        scale(.6)
        rotate(0deg);

    opacity:0;

    line-height:1;

    user-select:none;

    pointer-events:none;

    will-change:
        transform,
        opacity;

    animation-name:
        nexoraFloatingReaction;

    animation-timing-function:
        cubic-bezier(.22,.61,.36,1);

    animation-fill-mode:
        forwards;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,.25);

}


/* =====================================================
   MAIN ANIMATION
   ===================================================== */

@keyframes nexoraFloatingReaction{

    0%{

        opacity:0;

        transform:
            translate3d(
                0,
                40px,
                0
            )
            scale(.45)
            rotate(0deg);

    }


    12%{

        opacity:1;

        transform:
            translate3d(
                0,
                0,
                0
            )
            scale(1.15)
            rotate(
                var(--reaction-rotate)
            );

    }

/* =====================================================
   NEXORA GOOGLE LOGIN — UPDATED & SAFE
   ===================================================== */

function googleLogin(){

    console.log("NEXORA Google Login শুরু হচ্ছে...");

    if(!auth){

        alert("Firebase Authentication পাওয়া যাচ্ছে না।");

        return;
    }


    if(!provider){

        alert("Google Login Provider পাওয়া যাচ্ছে না।");

        return;
    }


    auth.signInWithPopup(provider)

        .then(function(result){

            console.log(
                "Google Login সফল:",
                result.user
            );

            const user =
                result.user;


            /* ================= SAVE USER ================= */

            return db
                .collection("Users")
                .doc(user.uid)
                .set({

                    name:
                        user.displayName ||
                        "NEXORA User",

                    email:
                        user.email ||
                        "",

                    photoURL:
                        user.photoURL ||
                        "",

                    uid:
                        user.uid,

                    updatedAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                },{

                    merge:true

                });

        })

        .then(function(){

            console.log(
                "NEXORA User Firestore-এ সফলভাবে Save হয়েছে।"
            );

            /* ================= LOGIN SUCCESS ================= */

            alert(
                "🎉 NEXORA Login সফল হয়েছে!"
            );

        })

        .catch(function(error){

            console.error(
                "NEXORA GOOGLE LOGIN ERROR:",
                error
            );


            /* ================= ERROR DETAILS ================= */

            let message =
                error.message ||
                "Unknown Login Error";


            if(
                error.code ===
                "auth/popup-blocked"
            ){

                message =
                    "Google Login Popup Block হয়েছে। Browser-এর Popup অনুমতি দিন।";

            }


            else if(
                error.code ===
                "auth/popup-closed-by-user"
            ){

                message =
                    "Google Login window বন্ধ হয়ে গেছে।";

            }


            else if(
                error.code ===
                "auth/unauthorized-domain"
            ){

                message =
                    "এই Website Firebase Authentication-এ অনুমোদিত নয়। Firebase Console → Authentication → Settings → Authorized domains-এ Website domain যোগ করুন।";

            }


            else if(
                error.code ===
                "auth/operation-not-allowed"
            ){

                message =
                    "Firebase-এ Google Sign-in চালু করা নেই।";

            }


            alert(
                "❌ Google Login করা যায়নি:\n\n" +
                message
            );

        });

}

/* ================= POSTS ================= */

function loadPosts(){

    db.collection("Posts")
        .orderBy("createdAt","desc")
        .onSnapshot(function(snapshot){

            const feed =
                document.getElementById("postsFeed");

            if(!feed) return;

            feed.innerHTML = "";

            snapshot.forEach(function(doc){

                const post =
                    doc.data();

                const likes =
                    post.likes || [];

                const currentUser =
                    auth.currentUser;

                const liked =
                    currentUser &&
                    likes.includes(currentUser.uid);

                const postDiv =
                    document.createElement("div");

                postDiv.className = "post";

                let mediaHTML = "";

                if(
                    post.media &&
                    Array.isArray(post.media)
                ){

                    post.media.forEach(function(media){

                        if(!media || !media.url)
                            return;

                        if(media.type === "image"){

                            mediaHTML += `
                                <img
                                    class="post-media"
                                    src="${escapeHTML(media.url)}"
                                    alt="NEXORA Image"
                                >
                            `;

                        }

                        if(media.type === "video"){

                            mediaHTML += `
                                <video
                                    class="post-media"
                                    src="${escapeHTML(media.url)}"
                                    controls
                                    playsinline
                                    preload="metadata"
                                ></video>
                            `;

                        }

                    });

                }

                let extra = "";

                if(post.location){
                    extra += `
                        <div style="margin-top:8px;color:#65676b;font-size:14px;">
                            📍 ${escapeHTML(post.location)}
                        </div>
                    `;
                }

                if(post.feeling){
                    extra += `
                        <div style="margin-top:5px;color:#65676b;font-size:14px;">
                            😊 ${escapeHTML(post.feeling)}
                        </div>
                    `;
                }

                if(post.taggedPeople){
                    extra += `
                        <div style="margin-top:5px;color:#65676b;font-size:14px;">
                            👥 Tagged: ${escapeHTML(post.taggedPeople)}
                        </div>
                    `;
                }

                postDiv.innerHTML = `

                    <div class="post-user">
                        👤 ${escapeHTML(post.name || "NEXORA User")}
                    </div>

                    ${
                        post.text
                        ? `
                            <div class="post-text">
                                ${escapeHTML(post.text)}
                            </div>
                        `
                        : ""
                    }

                    ${mediaHTML}

                    ${extra}

                    ${
                        currentUser &&
                        post.uid === currentUser.uid
                        ? `
                            <button
                                class="delete-btn"
                                onclick="deletePost('${doc.id}')"
                            >
                                🗑️ Delete Post
                            </button>
                        `
                        : ""
                    }

                    <div class="post-actions">

                        <button
                            onclick="likePost('${doc.id}')"
                        >
                            ${liked ? "❤️ Liked" : "👍 Like"}
                            <span>${likes.length}</span>
                        </button>

                        <button
                            onclick="showCommentBox('${doc.id}')"
                        >
                            💬 Comment
                            <span id="commentCount-${doc.id}">
                                0
                            </span>
                        </button>

                        <button
                            onclick="sharePost('${doc.id}')"
                        >
                            ↗️ Share
                        </button>

                    </div>

                `;

                feed.appendChild(postDiv);

                loadCommentCount(
                    doc.id
                );

            });

        },function(error){

            console.error(
                "POST LOAD ERROR:",
                error
            );

        });

}

loadPosts();


/* ================= LIKE POST ================= */

function likePost(postId){

    const user =
        auth.currentUser;

    if(!user){
        alert("আগে Login করুন।");
        return;
    }

    const ref =
        db.collection("Posts")
          .doc(postId);

    db.runTransaction(function(transaction){

        return transaction.get(ref)
            .then(function(doc){

                if(!doc.exists)
                    throw new Error("Post পাওয়া যায়নি।");

                const data =
                    doc.data();

                const likes =
                    data.likes || [];

                if(likes.includes(user.uid)){

                    transaction.update(ref,{
                        likes:
                            firebase.firestore
                            .FieldValue
                            .arrayRemove(user.uid)
                    });

                }else{

                    transaction.update(ref,{
                        likes:
                            firebase.firestore
                            .FieldValue
                            .arrayUnion(user.uid)
                    });

                }

            });

    }).catch(function(error){

        console.error(error);

        alert(
            "Like করা যায়নি: " +
            error.message
        );

    });

}


/* ================= COMMENTS ================= */

function showCommentBox(postId){

    const old =
        document.getElementById(
            "commentBox-" + postId
        );

    if(old){
        old.remove();
        return;
    }

    const box =
        document.createElement("div");

    box.id =
        "commentBox-" + postId;

    box.className =
        "comment-box";

    box.innerHTML = `

        <input
            id="commentInput-${postId}"
            class="comment-input"
            type="text"
            placeholder="আপনার Comment লিখুন..."
        >

        <button
            class="comment-submit"
            onclick="addComment('${postId}')"
        >
            Comment করুন
        </button>

        <div
            id="commentsArea-${postId}"
        ></div>

    `;

    const button =
        document.querySelector(
            `button[onclick="showCommentBox('${postId}')"]`
        );

    if(button){

        const post =
            button.closest(".post");

        post.appendChild(box);

        loadComments(
            postId,
            box
        );

    }

}



function addComment(postId){

    const user =
        auth.currentUser;

    if(!user){
        alert("আগে Login করুন।");
        return;
    }

    const input =
        document.getElementById(
            "commentInput-" + postId
        );

    if(!input) return;

    const text =
        input.value.trim();

    if(!text){
        alert("Comment লিখুন।");
        return;
    }

    db.collection("Posts")
      .doc(postId)
      .collection("Comments")
      .add({

        // Comment যে ভাষায় লেখা হবে,
        // ঠিক সেই ভাষাতেই সংরক্ষণ হবে
        text: text,

        name:
            user.displayName ||
            "NEXORA User",

        uid:
            user.uid,

        createdAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

      })
      .then(function(){

        input.value = "";

      })
      .catch(function(error){

        console.error(error);

        alert(
            "Comment করা যায়নি: " +
            error.message
        );

      });

}

function loadCommentCount(postId){

    db.collection("Posts")
      .doc(postId)
      .collection("Comments")
      .onSnapshot(function(snapshot){

        const el =
            document.getElementById(
                "commentCount-" + postId
            );

        if(el){
            el.innerText =
                snapshot.size;
        }

      });

}


function loadComments(postId,box){

    db.collection("Posts")
      .doc(postId)
      .collection("Comments")
      .orderBy("createdAt","asc")
      .onSnapshot(function(snapshot){

        const area =
            box.querySelector(
                "#commentsArea-" + postId
            );

        if(!area) return;

        area.innerHTML = "";

        snapshot.forEach(function(doc){

            const comment =
                doc.data();

            const div =
                document.createElement("div");

            div.className =
                "comment-item";

            div.innerHTML = `
                <b>
                    👤 ${escapeHTML(
                        comment.name ||
                        "NEXORA User"
                    )}

/* =====================================================
   NEXORA STORY REACTION SYSTEM
   ===================================================== */

function reactToNexoraStory(storyId, emoji){

    const user = auth.currentUser;

    if(!user){

        alert("Reaction দিতে আগে Login করুন।");

        return;
    }


    /* ================= LOVE SPECIAL ANIMATION ================= */

    if(emoji === "❤️"){

        createNexoraLoveAnimation();

    }else{

        createNexoraReactionAnimation(emoji);

    }


    const reactionRef =
        db.collection("Stories")
          .doc(storyId)
          .collection("Reactions")
          .doc(user.uid);


    reactionRef.get()

        .then(function(doc){

            /* ================= SAME REACTION = REMOVE ================= */

            if(
                doc.exists &&
                doc.data().emoji === emoji
            ){

                return reactionRef.delete();

            }


            /* ================= NEW / CHANGED REACTION ================= */

            return reactionRef.set({

                uid:user.uid,

                name:
                    user.displayName ||
                    "NEXORA User",

                photoURL:
                    user.photoURL ||
                    "",

                emoji:emoji,

                createdAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            });

        })

        .then(function(){

            console.log(
                "NEXORA Reaction Updated:",
                emoji
            );

            loadNexoraStoryReactionUI(
                storyId
            );

        })

        .catch(function(error){

            console.error(
                "STORY REACTION ERROR:",
                error
            );

            alert(
                "Reaction দেওয়া যায়নি: " +
                error.message
            );

        });

}


/* =====================================================
   LOAD STORY REACTIONS
   ===================================================== */

function loadNexoraStoryReactionUI(storyId){

    const box =
        document.getElementById(
            "storyReactionBox-" + storyId
        );

    if(!box)
        return;


    db.collection("Stories")
      .doc(storyId)
      .collection("Reactions")
      .get()

      .then(function(snapshot){

          const counts = {

              "❤️":0,
              "😂":0,
              "😍":0,
              "😮":0,
              "😢":0,
              "😡":0,
              "👍":0,
              "🔥":0,
              "🎉":0

          };


          let myReaction = "";


          snapshot.forEach(function(doc){

              const reaction =
                  doc.data();

              const emoji =
                  reaction.emoji;


              if(
                  Object.prototype
                  .hasOwnProperty
                  .call(counts,emoji)
              ){

                  counts[emoji]++;

              }


              if(
                  auth.currentUser &&
                  reaction.uid ===
                  auth.currentUser.uid
              ){

                  myReaction = emoji;

              }

          });


          const buttons =
              box.querySelectorAll(
                  ".nx-story-reaction-btn"
              );


          buttons.forEach(function(button){

              const emoji =
                  button.dataset.emoji;


              const count =
                  counts[emoji] || 0;


              const countElement =
                  button.querySelector(
                      ".nx-reaction-count"
                  );


              if(countElement){

                  countElement.innerText =
                      count > 0
                      ? count
                      : "";

              }


              /* ================= MY REACTION ================= */

              if(
                  myReaction === emoji
              ){

                  button.classList.add(
                      "nx-my-reaction"
                  );

              }else{

                  button.classList.remove(
                      "nx-my-reaction"
                  );

              }

          });


          /* ================= TOTAL ================= */

          const total =
              snapshot.size;


          const totalElement =
              document.getElementById(
                  "storyReactionTotal-" +
                  storyId
              );


          if(totalElement){

              totalElement.innerText =
                  total > 0
                  ? total + " Reaction"
                  : "";

          }

      })

      .catch(function(error){

          console.error(
              "REACTION LOAD ERROR:",
              error
          );

      });

}

/* =====================================================

   ===================================================== */

function createSingleNexoraReaction(
    emoji,
    container
){

    const reaction =
        document.createElement("div");


    reaction.className =
        "nexora-floating-reaction";


    reaction.innerText =
        emoji;


    const left =
        Math.random() * 80 + 10;


    const size =
        Math.random() * 20 + 28;


    const duration =
        Math.random() * 1.2 + 2.2;


    const rotate =
        Math.random() * 50 - 25;


    const drift =
        Math.random() * 160 - 80;


    reaction.style.left =
        left + "%";


    reaction.style.fontSize =
        size + "px";


    reaction.style.setProperty(
        "--reaction-drift",
        drift + "px"
    );


    reaction.style.setProperty(
        "--reaction-rotate",
        rotate + "deg"
    );


    reaction.style.animationDuration =
        duration + "s";


    container.appendChild(
        reaction
    );


    setTimeout(function(){

        if(
            reaction &&
            reaction.parentNode
        ){

            reaction.remove();

        }

    }, duration * 1000 + 300);

}

        document.getElementById(
            "storyStatus"
        );

    status.innerText =
        "Story Upload হচ্ছে... ⏳";

        file.type.startsWith("video/")

function likeReel(reelId){

    const user =
        auth.currentUser;

    if(!user){
        alert("আগে Login করুন।");
        return;
    }

    const ref =
        db.collection("Reels")
          .doc(reelId);

    db.runTransaction(function(transaction){

        return transaction.get(ref)
            .then(function(doc){

                if(!doc.exists)
                    throw new Error(
                        "Reel পাওয়া যায়নি।"
                    );

                const data =
                    doc.data();

                const likes =
                    data.likes || [];

                if(likes.includes(user.uid)){

                    transaction.update(ref,{
                        likes:
                            firebase.firestore
                            .FieldValue
                            .arrayRemove(
                                user.uid
                            )
                    });

                }else{

                    transaction.update(ref,{
                        likes:
                            firebase.firestore
                            .FieldValue
                            .arrayUnion(
                                user.uid
                            )
                    });

                }

            });

    }).catch(function(error){

        alert(
            "Like করা যায়নি: " +
            error.message
        );

    });

}

/* ================= PUBLISH POST ================= */

function publishNexoraPost(){

    const user =
        auth.currentUser;

    if(!user){

        alert("আগে Login করুন.");
        return;

    }

    const textElement =
        document.getElementById(
            "nexoraPostText"
        );

    const text =
        textElement
        ? textElement.value.trim()
        : "";

    const files =
        selectedPostFiles || [];

    if(
        !text &&
        files.length === 0
    ){

        alert(
            "কিছু লিখুন অথবা ছবি/ভিডিও নির্বাচন করুন।"
        );

        return;

    }

    const button =
        document.querySelector(
            ".nx-publish-btn"
        );

    if(button){

        button.disabled = true;
        button.innerText =
            "Upload হচ্ছে... ⏳";

    }

    const promises =
        files.map(function(file){

            const type =
                file.type.startsWith("video/")
                ? "video"
                : "image";

            return uploadToCloudinary(
                file,
                type
            )
            .then(function(data){

                return {
                    url:
                        data.secure_url,

                    type:type
                };

            });

        });

    Promise.all(promises)

        .then(function(media){

            return db
                .collection("Posts")
                .add({

                    text:text,

                    name:
                        user.displayName ||
                        "NEXORA User",

                    email:
                        user.email || "",

                    uid:user.uid,

                    privacy:
                        selectedPostPrivacy,

                    feeling:
                        selectedPostFeeling,

                    location:
                        selectedPostLocation,

                    taggedPeople:
                        selectedPostTags,

                    background:
                        selectedPostBackground,

                    media:media,

                    likes:[],

                    createdAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                });

        })

        .then(function(){

            alert(
                "🎉 NEXORA-তে Post সফল হয়েছে!"
            );

            resetCreatePost();

            closeCreatePost();

        })

        .catch(function(error){

            console.error(error);

            alert(
                "Post করা যায়নি:\n\n" +
                error.message
            );

            if(button){

                button.disabled = false;

                button.innerText =
                    "🚀 Post";

            }

        });

}


function resetCreatePost(){

    selectedPostFiles = [];

    selectedPostFeeling = "";

    selectedPostLocation = "";

    selectedPostTags = "";

    selectedPostPrivacy =
        "Public";

    selectedPostBackground =

}


/* ================= DELETE POST ================= */

function deletePost(postId){

    const user =
        auth.currentUser;

    if(!user){

        alert("আগে Login করুন.");
        return;

    }

    const ref =
        db.collection("Posts")
          .doc(postId);

    ref.get()

        .then(function(doc){

            if(!doc.exists){

                throw new Error(
                    "Post পাওয়া যায়নি।"
                );

            }

            const post =
                doc.data();

            if(post.uid !== user.uid){

                throw new Error(
                    "আপনি এই Post Delete করতে পারবেন না।"
                );

            }

            if(
                !confirm(
                    "আপনি কি এই Post টি Delete করতে চান?"
                )
            ){

                return null;

            }

            return ref.delete();

        })

        .then(function(result){

            if(result === null)
                return;

            alert(
                "🗑️ Post সফলভাবে Delete হয়েছে!"
            );

        })

        .catch(function(error){

            console.error(error);

            alert(
                error.message
            );

        });

}

                    class="reel-video"
                    src="${escapeHTML(
                        reel.videoUrl || ""
                    )}"
                    controls
                    playsinline
                    preload="metadata"
                ></video>

                <div class="reel-actions">

                    <button
                        onclick="likeReel('${doc.id}')"
                    >
                        ${
                            liked
                            ? "❤️ Liked"
                            : "👍 Like"
                        }
                        ${likes.length}
                    </button>

                    <button
                        onclick="shareReel('${escapeHTML(
                            reel.videoUrl || ""
                        )}')"
                    >
                        ↗️ Share
                    </button>

                </div>

            `;

            container.appendChild(div);

        });

      })

      .catch(function(error){

        console.error(error);

        container.innerHTML = `
            <div style="
                text-align:center;
                padding:30px;
                color:red;
            ">
                Reels লোড করা যায়নি।
            </div>
        `;

      });

}


/* ================= CLOUDINARY ================= */

function uploadToCloudinary(
    file,
    type
){

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_PRESET
    );

    return fetch(
        "https://api.cloudinary.com/v1_1/" +
        CLOUDINARY_CLOUD +
        "/" +
        type +
        "/upload",
        {
            method:"POST",
            body:formData
        }
    )

    .then(function(response){

        return response.json()
            .then(function(data){

                if(!response.ok){

                    throw new Error(
                        data.error &&
                        data.error.message
                        ? data.error.message
                        : "Cloudinary Upload ব্যর্থ হয়েছে।"
                    );

                }

                return data;

            });

    });

}


/* ================= HELPERS ================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function copyText(text){

    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard.writeText(text)
            .then(function(){

                alert(
                    "🔗 Link কপি হয়েছে!"
                );

            })
            .catch(function(){

                alert(
                    "Link কপি করা যায়নি।"
                );

            });

    }else{

        alert(text);

    }
}

/* ================= NEXORA USER SEARCH ================= */

function searchNexoraUsers(){

    const input =
        document.getElementById(
            "nexoraSearchInput"
        );

    const results =
        document.getElementById(
            "nexoraSearchResults"
        );

    if(!input || !results)
        return;

    const searchText =
        input.value.trim().toLowerCase();

    if(!searchText){

        results.innerHTML = `
            <div style="
                text-align:center;
                color:#777;
                padding:30px;
            ">
                🔍 User-এর নাম লিখে Search করুন
            </div>
        `;

        return;
    }

    results.innerHTML = `
        <div style="
            text-align:center;
            color:#777;
            padding:25px;
        ">
            🔎 Search হচ্ছে...
        </div>
    `;


    db.collection("Users")
      .get()

      .then(function(snapshot){

        results.innerHTML = "";

        let found = false;

        snapshot.forEach(function(doc){

            const user =
                doc.data();

            const name =
                user.name ||
                user.displayName ||
                "NEXORA User";

            const email =
                user.email ||
                "";

            const nameMatch =
                name
                    .toLowerCase()
                    .includes(searchText);

            const emailMatch =
                email
                    .toLowerCase()
                    .includes(searchText);

            if(!nameMatch && !emailMatch)
                return;

            found = true;

            const div =
                document.createElement("div");

            div.style.cssText = `
                display:flex;
                align-items:center;
                gap:12px;
                padding:12px;
                margin-bottom:8px;
                background:#fff;
                border:1px solid #eee;
                border-radius:12px;
                cursor:pointer;
            `;


            const photo =
                user.photoURL ||
                user.photo ||
                "";


            div.innerHTML = `

                ${
                    photo
                    ? `
                        <img
                            src="${escapeHTML(photo)}"
                            style="
                                width:50px;
                                height:50px;
                                border-radius:50%;
                                object-fit:cover;
                            "
                        >
                    `
                    : `
                        <div style="
                            width:50px;
                            height:50px;
                            border-radius:50%;
                            background:#1877f2;
                            color:white;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:22px;
                        ">
                            👤
                        </div>
                    `
                }

                <div style="
                    flex:1;
                    min-width:0;
                ">

                    <div style="
                        font-size:16px;
                        font-weight:bold;
                        color:#222;
                    ">
                        ${escapeHTML(name)}
                    </div>

                    ${
                        email
                        ? `
                            <div style="
                                margin-top:3px;
                                font-size:13px;
                                color:#777;
                                overflow:hidden;
                                text-overflow:ellipsis;
                            ">
                                ${escapeHTML(email)}
                            </div>
                        `
                        : ""
                    }

                </div>

            `;


            results.appendChild(div);

        });


        if(!found){

            results.innerHTML = `
                <div style="
                    text-align:center;
                    color:#777;
                    padding:30px;
                ">
                    😔 কোনো User পাওয়া যায়নি।
                </div>
            `;

        }

    })

    .catch(function(error){

        console.error(
            "USER SEARCH ERROR:",
            error
        );

        results.innerHTML = `
            <div style="
                text-align:center;
                color:red;
                padding:30px;
            ">
                ❌ Search করা যায়নি।<br>
                <small>
                    ${escapeHTML(
                        error.message
                    )}
                </small>
            </div>
        `;

    });

}

/* =====================================================

   ===================================================== */

function renderNexoraAllStories(){

    const container =
        document.getElementById(
            "nexoraAllStoriesContainer"
        );


    if(!container)
        return;


    container.innerHTML = "";


    /* ================= EMPTY STORY CHECK ================= */

    if(
        !nexoraStories ||
        nexoraStories.length === 0
    ){

        container.innerHTML = `

            <div style="
                text-align:center;
                padding:50px 20px;
                color:#777;
            ">

                📖 এখনো কোনো Story নেই।

            </div>

        `;

        return;
    }


    /* ================= STORY GRID ================= */

    const grid =
        document.createElement("div");


    grid.style.cssText = `

        display:grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap:12px;

    `;


    /* ================= CREATE EACH STORY ================= */

    nexoraStories.forEach(
        function(story,index){

            const card =
                document.createElement("div");


            card.style.cssText = `

                position:relative;

                height:260px;

                border-radius:15px;

                overflow:hidden;

                background:#ddd;

                cursor:pointer;

                box-shadow:
                    0 2px 10px
                    rgba(0,0,0,.15);

            `;


            /* ================= STORY MEDIA ================= */

            let mediaHTML = "";


            if(
                story.mediaType === "video"
            ){

                mediaHTML = `

                    <video
                        src="${escapeHTML(
                            story.mediaUrl || ""
                        )}"
                        muted
                        playsinline
                        preload="metadata"

                        style="
                            width:100%;
                            height:100%;
                            object-fit:cover;
                            display:block;
                        "
                    ></video>

                `;

            }else{

                mediaHTML = `

                    <img
                        src="${escapeHTML(
                            story.mediaUrl || ""
                        )}"

                        alt="Story"

                        style="
                            width:100%;
                            height:100%;
                            object-fit:cover;
                            display:block;
                        "
                    >

                `;

            }


            /* ================= PROFILE PHOTO ================= */

            const profile =
                story.photoURL || "";


            /* ================= STORY CARD HTML ================= */

            card.innerHTML = `

                ${mediaHTML}


                <!-- ================= DARK OVERLAY ================= -->

                <div style="
                    position:absolute;
                    inset:0;

                    background:
                        linear-gradient(
                            transparent 40%,
                            rgba(0,0,0,.80)
                        );

                    pointer-events:none;
                "></div>


                <!-- ================= PROFILE ================= -->

                <div style="
                    position:absolute;

                    top:10px;
                    left:10px;

                    width:44px;
                    height:44px;

                    border-radius:50%;

                    overflow:hidden;

                    border:2px solid #fff;

                    background:#1877f2;

                    display:flex;

                    align-items:center;

                    justify-content:center;

                    z-index:2;
                ">

                    ${
                        profile
                        ?
                        `
                        <img
                            src="${escapeHTML(
                                profile
                            )}"

                            style="
                                width:100%;
                                height:100%;
                                object-fit:cover;
                            "
                        >
                        `
                        :
                        `
                        <span style="
                            color:#fff;
                            font-size:22px;
                        ">
                            👤
                        </span>
                        `
                    }

                </div>


                <!-- ================= STORY NAME ================= -->

                <div style="
                    position:absolute;

                    left:12px;
                    right:8px;
                    bottom:12px;

                    color:#fff;

                    font-size:15px;

                    font-weight:bold;

                    text-shadow:
                        0 1px 4px #000;

                    z-index:2;

                    overflow:hidden;

                    white-space:nowrap;

                    text-overflow:ellipsis;
                ">

                    ${escapeHTML(
                        story.name ||
                        "NEXORA User"
                    )}

                </div>

            `;


            /* =================================================
               CLICK STORY → FULL SCREEN
               ================================================= */

            card.onclick =
                function(){

                    /* ================= CLOSE ALL STORIES PAGE ================= */

                    closeNexoraAllStories();


                    /* ================= OPEN SELECTED STORY ================= */

                    currentStoryIndex =
                        index;


                    openNexoraStory(
                        index
                    );

                };


            grid.appendChild(card);

        }
    );


    container.appendChild(grid);

}
