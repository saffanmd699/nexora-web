<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    background:#f0f2f5;
    color:#1c1e21;
}

button{
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

/* ================= LOGIN ================= */

#loginSection{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.login-box{
    width:100%;
    max-width:400px;
}

.logo{
    width:150px;
    height:55px;
    margin:0 auto 20px;
    background:linear-gradient(135deg,#1877f2,#635bff);
    color:white;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;
}

#loginSection h2{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#65676b;
    margin-bottom:20px;
}

#loginSection button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#message{
    text-align:center;
    margin-top:15px;
}

#message.error{
    color:#e41e3f;
}

/* ================= HOME ================= */

#homeSection{
    display:none;
    min-height:100vh;
    padding-bottom:80px;
}

/* ================= HEADER ================= */

.nx-header{
    position:sticky;
    top:0;
    z-index:1000;
    min-height:64px;
    width:100%;
    background:rgba(255,255,255,.98);
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 15px;
    border-bottom:1px solid #ddd;
    box-shadow:0 1px 5px rgba(0,0,0,.1);
}

.nx-logo{
    color:#1877f2;
    font-size:28px;
    font-weight:800;
    white-space:nowrap;
}

/* REAL SEARCH */

.nx-search{
    height:42px;
    max-width:390px;
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    background:#f0f2f5;
    border-radius:24px;
    padding:0 15px;
    border:1px solid transparent;
}

.nx-search:focus-within{
    background:white;
    border-color:#1877f2;
}

.nx-search input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    font-size:15px;
}

.nx-header-buttons{
    margin-left:auto;
    display:flex;
    gap:7px;
}

.nx-top-btn{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:#f0f2f5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
    position:relative;
}

.nx-top-btn:hover{
    background:#e4e6eb;
}

.nx-badge{
    position:absolute;
    top:-2px;
    right:-2px;
    min-width:18px;
    height:18px;
    border-radius:50%;
    background:#e41e3f;
    color:white;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:2px solid white;
}

/* ================= SEARCH RESULTS ================= */

#searchResults{
    display:none;
    position:fixed;
    top:64px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:600px;
    max-height:70vh;
    overflow-y:auto;
    background:white;
    z-index:2500;
    border-radius:0 0 14px 14px;
    box-shadow:0 5px 20px rgba(0,0,0,.18);
}

.search-result{
    padding:13px 15px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.search-result:hover{
    background:#f0f2f5;
}

.search-empty{
    padding:25px;
    text-align:center;
    color:#65676b;
}

/* ================= FEED ================= */

.nx-feed{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:10px 8px 90px;
}

.nx-card{
    background:white;
    border-radius:15px;
    border:1px solid #e4e6eb;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    margin-bottom:12px;
    padding:14px;
}

/* ================= CREATE ================= */

.nx-mind-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.nx-avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    flex-shrink:0;
    background:linear-gradient(135deg,#1877f2,#635bff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    overflow:hidden;
}

.nx-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.nx-mind{
    flex:1;
    min-height:46px;
    background:#f0f2f5;
    border-radius:25px;
    padding:12px 18px;
    color:#65676b;
    cursor:pointer;
    display:flex;
    align-items:center;
}

.nx-action-row{
    display:flex;
    border-top:1px solid #e4e6eb;
    margin-top:14px;
    padding-top:9px;
}

.nx-action-row button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 5px;
    border-radius:9px;
    font-weight:600;
}

.nx-action-row button:hover{
    background:#f0f2f5;
}

/* ================= STORIES ================= */

.nx-section-title{
    display:flex;
    justify-content:space-between;
    margin-bottom:13px;
}

.nx-section-title b{
    font-size:19px;
}

.nx-section-title span{
    color:#1877f2;
    font-weight:bold;
    cursor:pointer;
}

.nx-stories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
}

.nx-stories::-webkit-scrollbar{
    display:none;
}

.nx-story-list{
    display:flex;
    gap:10px;
}

.nx-story{
    width:108px;
    min-width:108px;
    height:185px;
    border-radius:15px;
    overflow:hidden;
    background:#ddd;
    position:relative;
    flex-shrink:0;
}

.nx-story img,
.nx-story video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.create-story{
    background:linear-gradient(160deg,#635bff,#1877f2);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    align-items:center;
    padding-bottom:14px;
}

.story-plus{
    width:48px;
    height:48px;
    background:white;
    color:#1877f2;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    margin-bottom:8px;
}

/* ================= POSTS ================= */

.nx-section-heading{
    background:white;
    padding:15px;
    margin-top:12px;
    border-radius:14px 14px 0 0;
    border-bottom:1px solid #ddd;
    font-size:18px;
}

.post{
    background:white;
    padding:14px;
    margin-bottom:13px;
    border-radius:0 0 14px 14px;
    box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.post-user{
    font-weight:bold;
    margin-bottom:8px;
}

.post-text{
    font-size:17px;
    line-height:1.55;
    white-space:pre-wrap;
    margin-bottom:8px;
}

.post-media{
    width:100%;
    max-height:600px;
    object-fit:cover;
    border-radius:11px;
    margin-top:8px;
    display:block;
}

.post-actions{
    display:flex;
    gap:3px;
    border-top:1px solid #e4e6eb;
    margin-top:10px;
    padding-top:7px;
}

.post-actions button{
    flex:1;
    border:none;
    background:transparent;
    padding:10px 4px;
    color:#65676b;
    font-weight:600;
    border-radius:8px;
}

.post-actions button:hover{
    background:#f0f2f5;
}

.delete-btn{
    margin-top:9px;
    padding:8px 13px;
    border:none;
    border-radius:8px;
    background:#ffe5e5;
    color:#e41e3f;
}

/* ================= COMMENTS ================= */

.comment-box{
    margin-top:10px;
    border-top:1px solid #eee;
    padding-top:10px;
}

.comment-input{
    width:100%;
    padding:11px 14px;
    border:1px solid #ddd;
    border-radius:20px;
    outline:none;
}

.comment-submit{
    margin-top:8px;
    padding:8px 15px;
    border:none;
    background:#1877f2;
    color:white;
    border-radius:8px;
}

.comment-item{
    background:#f0f2f5;
    padding:9px 12px;
    margin-top:8px;
    border-radius:10px;
}

/* ================= BOTTOM NAV ================= */

.nx-bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:68px;
    background:rgba(255,255,255,.98);
    border-top:1px solid #ddd;
    box-shadow:0 -2px 10px rgba(0,0,0,.1);
    z-index:3000;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nx-bottom-nav button{
    min-width:55px;
    border:none;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    color:#555;
    font-size:20px;
}

.nx-bottom-nav button.active{
    color:#1877f2;
}

.nx-bottom-nav small{
    font-size:11px;
    font-weight:bold;
}

.nx-create-button{
    width:45px;
    height:45px;
    background:#1877f2;
    color:white;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
}

/* ================= MODAL ================= */

.nx-modal-page{
    position:fixed;
    inset:0;
    background:#f0f2f5;
    z-index:5000;
    overflow-y:auto;
}

.nx-modal-header{
    height:60px;
    background:white;
    display:flex;
    align-items:center;
    padding:0 15px;
    box-shadow:0 1px 5px rgba(0,0,0,.12);
    position:sticky;
    top:0;
    z-index:5;
}

.nx-back-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:#f0f2f5;
    font-size:23px;
}

.nx-create-container{
    max-width:650px;
    margin:auto;
    padding:15px 10px 100px;
}

.nx-create-box{
    background:white;
    border-radius:15px;
    padding:15px;
}

.nx-create-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.nx-create-user img,
.nx-create-fallback{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

.nx-create-fallback{
    background:#e4e6eb;
    display:flex;
    align-items:center;
    justify-content:center;
}

#nexoraPostText{
    width:100%;
    min-height:140px;
    margin-top:15px;
    padding:15px;
    border:none;
    outline:none;
    resize:none;
    border-radius:14px;
    font-size:18px;
}

.nx-add-box{
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    margin-top:12px;
}

.nx-add-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.nx-add-buttons button{
    border:none;
    background:#f0f2f5;
    padding:10px 12px;
    border-radius:9px;
}

.nx-publish-btn{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:17px;
    font-weight:bold;
}

/* ================= REELS ================= */

#nexoraReelsPage{
    display:none;
    position:fixed;
    inset:0;
    z-index:4000;
    background:#f0f2f5;
    overflow-y:auto;
    padding-bottom:80px;
}

.reels-container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:10px;
}

.reel-card{
    background:#000;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:18px;
}

.reel-header{
    color:white;
    padding:12px 15px;
    font-weight:bold;
}

.reel-video{
    width:100%;
    max-height:650px;
    display:block;
    background:#000;
}

.reel-actions{
    display:flex;
    gap:8px;
    padding:10px 15px 15px;
}

.reel-actions button{
    flex:1;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
    padding:10px;
}

/* ================= MOBILE ================= */

@media(max-width:699px){

    .nx-header{
        min-height:60px;
        padding:7px 8px;
        gap:7px;
    }

    .nx-logo{
        font-size:23px;
    }

    /* SEARCH WILL REMAIN VISIBLE */

    .nx-search{
        display:flex;
        min-width:0;
        max-width:none;
        height:40px;
        padding:0 12px;
    }

    .nx-search input{
        font-size:13px;
    }

    .nx-header-buttons{
        gap:4px;
    }

    .nx-top-btn{
        width:38px;
        height:38px;
        font-size:17px;
    }

    .nx-feed{
        padding-left:5px;
        padding-right:5px;
    }

    .nx-story{
        width:105px;
        min-width:105px;
        height:178px;
    }

    .post-text{
        font-size:16px;
    }

    #searchResults{
        top:60px;
        width:96%;
    }
}

/* VERY SMALL PHONES */

@media(max-width:390px){

    .nx-logo{
        font-size:20px;
    }

    .nx-search{
        height:37px;
    }

    .nx-top-btn{
        width:35px;
        height:35px;
    }

    .nx-header{
        gap:4px;
        padding:6px;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginSection">

    <div class="login-box">

        <div class="logo">
            NEXORA
        </div>

        <h2>
            Login to NEXORA
        </h2>

        <p class="subtitle">
            Gmail দিয়ে Login করুন
        </p>

        <button onclick="googleLogin()">
            🔐 Sign in with Google
        </button>

        <div id="message"></div>

    </div>

</div>


<!-- ================= HOME ================= -->

<div id="homeSection">

    <!-- HEADER -->

    <div class="nx-header">

        <div class="nx-logo">
            NEXORA
        </div>

        <!-- REAL SEARCH -->

        <div class="nx-search">

            <span>🔍</span>

            <input
                id="searchInput"
                type="search"
                placeholder="Search NEXORA"
                autocomplete="off"
                oninput="searchNexora(this.value)"
            >

        </div>

        <div class="nx-header-buttons">

            <button
                class="nx-top-btn"
                onclick="openCreatePost()"
            >
                ＋
            </button>

            <button
                class="nx-top-btn"
                onclick="openMessages()"
            >
                💬
                <span class="nx-badge">0</span>
            </button>

            <button
                class="nx-top-btn"
                onclick="openNotifications()"
            >
                🔔
                <span class="nx-badge">0</span>
            </button>

        </div>

    </div>


    <!-- SEARCH RESULTS -->

    <div id="searchResults"></div>


    <!-- FEED -->

    <div class="nx-feed">

        <!-- CREATE CARD -->

        <div class="nx-card">

            <div class="nx-mind-row">

                <div
                    id="homeAvatar"
                    class="nx-avatar"
                >
                    👤
                </div>

                <div
                    class="nx-mind"
                    onclick="openCreatePost()"
                >
                    What's on your mind?
                </div>

            </div>

            <div class="nx-action-row">

                <button
                    onclick="openCreatePost()"
                >
                    📝 Post
                </button>

                <button
                    onclick="document.getElementById('reelVideo').click()"
                >
                    🎬 Reel
                </button>

                <button
                    onclick="createStory()"
                >
                    📷 Story
                </button>

            </div>

        </div>


        <!-- STORIES -->

        <div class="nx-card">

            <div class="nx-section-title">

                <b>
                    Stories
                </b>

                <span onclick="showAllStories()">
                    See all
                </span>

            </div>

            <div class="nx-stories">

                <div
                    class="nx-story create-story"
                    onclick="createStory()"
                >

                    <div class="story-plus">
                        +
                    </div>

                    <b>
                        Create Story
                    </b>

                </div>

                <div
                    id="storiesFeed"
                    class="nx-story-list"
                ></div>

            </div>

        </div>


        <!-- FILE INPUTS -->

        <input
            type="file"
            id="storyMedia"
            accept="image/*,video/*"
            style="display:none"
            onchange="uploadStory()"
        >

        <input
            type="file"
            id="reelVideo"
            accept="video/*"
            style="display:none"
            onchange="uploadReel()"
        >

        <div
            id="storyStatus"
            style="display:none;text-align:center;padding:10px;"
        ></div>

        <div
            id="reelStatus"
            style="display:none;text-align:center;padding:10px;"
        ></div>


        <!-- REELS -->

        <div class="nx-section-heading">
            🎬 Reels
        </div>

        <div id="reelsFeed"></div>


        <!-- POSTS -->

        <div class="nx-section-heading">
            📰 Posts
        </div>

        <div id="postsFeed"></div>

    </div>


    <!-- BOTTOM NAV -->

    <div class="nx-bottom-nav">

        <button class="active">
            🏠
            <small>Home</small>
        </button>

        <button onclick="openFriends()">
            👥
            <small>Friends</small>
        </button>

        <button onclick="openCreatePost()">
            <span class="nx-create-button">
                ＋
            </span>
            <small>Create</small>
        </button>

        <button onclick="openNexoraReels()">
            🎬
            <small>Reels</small>
        </button>

        <button onclick="openProfile()">
            👤
            <small>Profile</small>
        </button>

    </div>

</div>


<!-- ================= REELS PAGE ================= -->

<div id="nexoraReelsPage">

    <div class="nx-modal-header">

        <button
            class="nx-back-btn"
            onclick="closeNexoraReels()"
        >
            ←
        </button>

        <b style="margin-left:15px;font-size:21px;">
            🎬 Reels
        </b>

    </div>

    <div
        id="nexoraReelsContainer"
        class="reels-container"
    ></div>

</div>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBJ-HDSL70D_xMZCSjsN5ZEGz4X4BFs9jE",

    authDomain:
        "nexora-b1945.firebaseapp.com",

    projectId:
        "nexora-b1945",

    storageBucket:
        "nexora-b1945.firebasestorage.app",

    messagingSenderId:
        "443615979456",

    appId:
        "1:443615979456:web:82f38923fa332df6094a25"
};

firebase.initializeApp(firebaseConfig);

const db =
    firebase.firestore();

const auth =
    firebase.auth();

const provider =
    new firebase.auth.GoogleAuthProvider();


/* =====================================================
   CLOUDINARY
===================================================== */

const CLOUDINARY_CLOUD =
    "xnpnqatf";

const CLOUDINARY_PRESET =
    "NEXORA _Reels";


/* =====================================================
   LOGIN
===================================================== */

function googleLogin(){

    const message =
        document.getElementById("message");

    message.className = "";

    message.innerText =
        "Google Login চালু হচ্ছে...";

    auth.signInWithPopup(provider)

    .catch(function(error){

        console.error(error);

        message.className =
            "error";

        message.innerText =
            "Login করা যায়নি: " +
            error.message;

    });

}


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(function(user){

    const login =
        document.getElementById(
            "loginSection"
        );

    const home =
        document.getElementById(
            "homeSection"
        );

    if(user){

        login.style.display =
            "none";

        home.style.display =
            "block";

        updateHomeUser(user);

    }else{

        login.style.display =
            "flex";

        home.style.display =
            "none";

    }

});


function updateHomeUser(user){

    const avatar =
        document.getElementById(
            "homeAvatar"
        );

    if(
        avatar &&
        user.photoURL
    ){

        avatar.innerHTML = `
            <img
                src="${escapeHTML(user.photoURL)}"
                alt="Profile"
            >
        `;

    }

}


/* =====================================================
   SEARCH
===================================================== */

let searchTimer = null;

function searchNexora(value){

    const query =
        value.trim().toLowerCase();

    const box =
        document.getElementById(
            "searchResults"
        );

    if(!query){

        box.style.display =
            "none";

        box.innerHTML =
            "";

        return;

    }

    box.style.display =
        "block";

    box.innerHTML = `
        <div class="search-empty">
            🔎 Search করা হচ্ছে...
        </div>
    `;

    clearTimeout(searchTimer);

    searchTimer =
        setTimeout(function(){

            Promise.all([

                db.collection("Posts")
                    .limit(50)
                    .get(),

                db.collection("Reels")

                    .get()

            ])

            .then(function(results){

                const posts =
                    results[0];

                const reels =
                    results[1];

                box.innerHTML =

                let found = 0;

                posts.forEach(function(doc){

                    const data =
                        doc.data();

                    const text =
                        (

                        ).toLowerCase();

                    const name =
                        (
                            data.name || ""
                        ).toLowerCase();

                    if(
                        text.includes(query) ||
                        name.includes(query)

                        found++;

                        const item =

                                "div"
                            );

                        item.className =
                            "search-result";

                                color:#65676b;
                            ">

                                    (data.text || "")

                                )}

                        item.onclick =
                            function(){

                                box.style.display =
                                    "none";

                                scrollToPost(
                                    doc.id
                                );

                            };

                        box.appendChild(item);

                    }

                });

                reels.forEach(function(doc){

                    const data =
                        doc.data();

                    const name =
                        (
                            data.name || ""
                        ).toLowerCase();

                    if(name.includes(query)){

                        found++;

                        const item =
                            document.createElement(
                                "div"
                            );

                        item.className =
                            "search-result";

                        item.innerHTML = `
                            🎬
                            <b>
                                ${escapeHTML(
                                    data.name ||
                                    "NEXORA User"
                                )}
                            </b>

                            <div style="
                                margin-top:4px;
                                color:#65676b;
                            ">
                                NEXORA Reel
                            </div>
                        `;

                        box.appendChild(item);

                    }

                });

                if(!found){

                    box.innerHTML = `
                        <div class="search-empty">
                            🔍 কিছু পাওয়া যায়নি
                        </div>
                    `;

                }

            })

            .catch(function(error){

                console.error(error);

                box.innerHTML = `
                    <div class="search-empty">
                        Search করা যায়নি।
                    </div>
                `;

            });

        },300);

}


function scrollToPost(postId){

    const posts =
        document.querySelectorAll(
            ".post"
        );

    posts.forEach(function(post){

        if(
            post.innerHTML.includes(
                postId
            )
        ){

            post.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

        }

    });

}

   POSTS

function loadPosts(){

    db.collection("Posts")
      .orderBy(
          "createdAt",
          "desc"
      )
      .onSnapshot(function(snapshot){

        const feed =
            document.getElementById(
                "postsFeed"
            );

        if(!feed) return;

        feed.innerHTML =
            "";

        snapshot.forEach(function(doc){

            const post =
                doc.data();

            const likes =
                post.likes || [];

            const user =
                auth.currentUser;

            const liked =
                user &&
                likes.includes(
                    user.uid
                );

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "post";

            let mediaHTML =
                "";

            if(
                Array.isArray(
                    post.media
                )
            ){

                post.media.forEach(
                    function(media){

                        if(
                            !media ||
                            !media.url
                        )
                            return;

                        if(
                            media.type ===
                            "image"
                        ){

                            mediaHTML += `
                                <img
                                    class="post-media"
                                    src="${escapeHTML(
                                        media.url
                                    )}"
                                >
                            `;

                        }

                        if(
                            media.type ===
                            "video"
                        ){

                            mediaHTML += `
                                <video
                                    class="post-media"
                                    src="${escapeHTML(
                                        media.url
                                    )}"
                                    controls
                                    playsinline
                                ></video>
                            `;

                        }

                    }
                );

            }

            div.innerHTML = `

                <div class="post-user">
                    👤
                    ${escapeHTML(
                        post.name ||
                        "NEXORA User"
                    )}
                </div>

                ${
                    post.text
                    ? `
                        <div class="post-text">
                            ${escapeHTML(
                                post.text
                            )}
                        </div>
                    `
                    : ""
                }

                ${mediaHTML}

                ${
                    post.feeling
                    ? `
                        <div style="
                            margin-top:7px;
                            color:#65676b;
                        ">
                            😊
                            ${escapeHTML(
                                post.feeling
                            )}
                        </div>
                    `
                    : ""
                }

                ${
                    post.location
                    ? `
                        <div style="
                            margin-top:5px;
                            color:#65676b;
                        ">
                            📍
                            ${escapeHTML(
                                post.location
                            )}
                        </div>
                    `
                    : ""
                }

                <div class="post-actions">

                    <button
                        onclick="likePost('${doc.id}')"
                    >
                        ${
                            liked
                            ? "❤️ Liked"
                            : "👍 Like"
                        }
                        ${likes.length}
                    </button>

                    <button
                        onclick="showCommentBox('${doc.id}')"
                    >
                        💬 Comment
                        <span
                            id="commentCount-${doc.id}"
                        >
                            0
                        </span>
                    </button>

                    <button
                        onclick="sharePost('${doc.id}')"
                    >
                        ↗️ Share
                    </button>

                </div>

                ${
                    user &&
                    post.uid === user.uid
                    ? `
                        <button
                            class="delete-btn"
                            onclick="deletePost('${doc.id}')"
                        >
                            🗑️ Delete
                        </button>
                    `
                    : ""
                }

            `;

            feed.appendChild(div);

            loadCommentCount(
                doc.id
            );

        });

      })

      .catch(function(error){

        console.error(
            "Posts error:",
            error
        );

      });

}

/* =====================================================
   LIKE
===================================================== */

function likePost(postId){

    const user =
        auth.currentUser;

    if(!user){

        alert(
            "আগে Login করুন।"
        );

        return;

    }

    const ref =
        db.collection("Posts")
          .doc(postId);

    db.runTransaction(
        function(transaction){

            return transaction
                .get(ref)
                .then(function(doc){

                    if(!doc.exists)
                        throw new Error(
                            "Post পাওয়া যায়নি।"
                        );

                    const likes =
                        doc.data().likes ||
                        [];

                    if(
                        likes.includes(
                            user.uid
                        )
                    ){

                        transaction.update(
                            ref,
                            {
                                likes:
                                    firebase.firestore
                                    .FieldValue
                                    .arrayRemove(
                                        user.uid
                                    )
                            }
                        );

                    }else{

                        transaction.update(
                            ref,
                            {
                                likes:
                                    firebase.firestore
                                    .FieldValue
                                    .arrayUnion(
                                        user.uid
                                    )
                            }
                        );

                    }

                });

        }
    )

    .catch(function(error){

        console.error(error);

        alert(
            "Like করা যায়নি।"
        );

    });

}

function showCommentBox(postId){

    const old =
        document.getElementById(
            "commentBox-" +
            postId
        );

    if(old){

        old.remove();

        return;

    }

    const box =
        document.createElement(
            "div"
        );

    box.id =
        "commentBox-" +
        postId;

    box.className =
        "comment-box";

    box.innerHTML = `

        <input
            id="commentInput-${postId}"
            class="comment-input"
            placeholder="আপনার Comment লিখুন..."
        >

        <button
            class="comment-submit"
            onclick="addComment('${postId}')"
        >
            Comment করুন
        </button>

        <div
            id="commentsArea-${postId}"
        ></div>

    `;

    const buttons =
        document.querySelectorAll(
            ".post-actions button"
        );

    buttons.forEach(function(button){

        if(
            button.getAttribute(
                "onclick"
            ) ===
            "showCommentBox('" +
            postId +

        ){

            button
                .closest(".post")
                .appendChild(box);

        }

    loadComments(

function addComment(postId){

    const user =
        auth.currentUser;

    if(!user){

        alert(
            "আগে Login করুন।"
        );

        return;

    }

    const input =
        document.getElementById(
            "commentInput-" +
            postId
        );

    const text =
        input.value.trim();

    if(!text){

        alert(
            "Comment লিখুন।"
        );

        return;

    }

    db.collection("Posts")
      .doc(postId)
      .collection("Comments")
      .add({

        text:text,

        name:
            user.displayName ||
            "NEXORA User",

        uid:
            user.uid,

        createdAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

      })

      .then(function(){

        input.value =
            "";

      })

      .catch(function(error){

        alert(
            "Comment করা যায়নি: " +
            error.message
        );

      });

}

    .catch(function(error){

/* =====================================================
   PUBLISH
===================================================== */

function publishNexoraPost(){

    const user =
        auth.currentUser;

    if(!user)
        return;

    const textElement =
        document.getElementById(
            "nexoraPostText"
        );

    const text =
        textElement
        ? textElement.value.trim()
        : "";

    if(
        !text &&
        selectedPostFiles.length === 0
    ){

        alert(
            "কিছু লিখুন অথবা ছবি/ভিডিও দিন।"
        );

        return;

    }

    const button =
        document.querySelector(
            ".nx-publish-btn"
        );

    button.disabled =
        true;

    button.innerText =
        "Upload হচ্ছে... ⏳";

    Promise.all(

        selectedPostFiles.map(
            function(file){

                const type =
                    file.type.startsWith(
                        "video/"
                    )
                    ? "video"
                    : "image";

                return uploadToCloudinary(
                    file,
                    type
                )
                .then(function(data){

                    return {

                        url:
                            data.secure_url,

                        type:
                            type

                    };

                });

            }
        )

    )

    .then(function(media){

        return db
            .collection("Posts")
            .add({

                text:
                    text,

                name:
                    user.displayName ||
                    "NEXORA User",

                uid:
                    user.uid,

                privacy:
                    selectedPostPrivacy,

                feeling:
                    selectedPostFeeling,

                location:
                    selectedPostLocation,

                media:
                    media,

                likes:
                    [],

                createdAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            });

    })

    .then(function(){

        alert(
            "🎉 Post সফল হয়েছে!"
        );

        selectedPostFiles =
            [];

        selectedPostFeeling =
            "";

        selectedPostLocation =
            "";

        selectedPostPrivacy =
            "Public";

        closeCreatePost();

    })

    .catch(function(error){

        console.error(error);

        alert(
            "Post করা যায়নি:\n" +
            error.message
        );

        button.disabled =
            false;

        button.innerText =
            "🚀 Post";

    });

}


/* =====================================================
   DELETE
===================================================== */

function deletePost(postId){

    const user =
        auth.currentUser;

    if(!user)
        return;

    if(
        !confirm(
            "এই Post Delete করবেন?"
        )
    )
        return;

    db.collection("Posts")
      .doc(postId)
      .get()

      .then(function(doc){

        if(!doc.exists)
            throw new Error(
                "Post পাওয়া যায়নি।"
            );

        if(
            doc.data().uid !==
            user.uid
        )
            throw new Error(
                "আপনি এই Post Delete করতে পারবেন না।"
            );

        return doc.ref.delete();

      })

      .then(function(){

        alert(
            "🗑️ Post Delete হয়েছে।"
        );

      })

      .catch(function(error){

        alert(
            error.message
        );

      });

}

/* =====================================================
   CLOUDINARY
===================================================== */

function uploadToCloudinary(
    file,
    type
){

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_PRESET
    );

    return fetch(

        "https://api.cloudinary.com/v1_1/" +
        CLOUDINARY_CLOUD +
        "/" +
        type +
        "/upload",

        {
            method:"POST",
            body:formData
        }

    )

    .then(function(response){

        return response.json()
            .then(function(data){

                if(!response.ok){

                    throw new Error(
                        data.error &&
                        data.error.message
                        ? data.error.message
                        : "Upload ব্যর্থ হয়েছে।"
                    );

                }

                return data;

            });

    });

}


/* =====================================================
   HELPERS
===================================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    )
        return "";

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function copyText(text){

    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard
            .writeText(text)
            .then(function(){

                alert(
                    "🔗 Link কপি হয়েছে!"
                );

            });

    }else{

        alert(text);

    }

}
