<script>

const firebaseConfig = {
    apiKey: "AIzaSyBJ-HDSL70D_xMZCSjsN5ZEGz4X4BFs9jE",
    authDomain: "nexora-b1945.firebaseapp.com",
    projectId: "nexora-b1945",
    storageBucket: "nexora-b1945.firebasestorage.app",
    messagingSenderId: "443615979456",
    appId: "1:443615979456:web:82f38923fa332df6094a25"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const provider = new firebase.auth.GoogleAuthProvider();


// Google Login
function googleLogin() {

    const message = document.getElementById("message");

    message.className = "";
    message.innerText = "Google Login চালু হচ্ছে...";

    auth.signInWithPopup(provider)

        .then(function(result) {

            const user = result.user;

            document.getElementById("loginSection")
                .style.display = "none";

            document.getElementById("homeSection")
                .style.display = "block";

            document.getElementById("userName")
                .innerText = "নাম: " + (user.displayName || "");

            document.getElementById("userEmail")
                .innerText = "Gmail: " + user.email;

        })

        .catch(function(error) {

            console.error(error);

            message.className = "error";

            message.innerText =
                "Login করা যায়নি: " + error.message;

        });
}


// Logout
function logout() {

    auth.signOut()
        .then(function() {

            document.getElementById("homeSection")
                .style.display = "none";

            document.getElementById("loginSection")
                .style.display = "block";

            document.getElementById("message")
                .innerText = "";

        });
}


// আগে Login করা থাকলে
auth.onAuthStateChanged(function(user) {

    if (user) {

        document.getElementById("loginSection")
            .style.display = "none";

        document.getElementById("homeSection")
            .style.display = "block";
document.getElementById("profileName")
    .innerText = user.displayName || "NEXORA User";

document.getElementById("profileEmail")
    .innerText = user.email || "";

document.getElementById("profilePhoto")
    .src = user.photoURL || "";
        document.getElementById("userName")
            .innerText = "নাম: " + (user.displayName || "");

        document.getElementById("userEmail")
            .innerText = "Gmail: " + user.email;

    }

});
function createPost() {

    const text = document.getElementById("postText").value.trim();

    if (!text) {
        alert("কিছু লিখে পোস্ট করুন।");
        return;
    }

    const user = auth.currentUser;

    if (!user) {
        alert("আগে Login করুন।");
        return;
    }

    db.collection("Posts").add({
        text: text,
        name: user.displayName || "NEXORA User",
        email: user.email,
        uid: user.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(function() {

        document.getElementById("postText").value = "";

        alert("Post সফলভাবে করা হয়েছে! 🎉");

    })
    .catch(function(error) {

        console.error(error);

        alert("Post করা যায়নি: " + error.message);

    });
}

// Load posts from Firestore
db.collection("Posts")
    .orderBy("createdAt", "desc")
    .onSnapshot(function(snapshot) {

        const postsFeed = document.getElementById("postsFeed");

        postsFeed.innerHTML = "";

        snapshot.forEach(function(doc) {

            const post = doc.data();
const likes = post.likes || [];
const likeCount = likes.length;
const userLiked = auth.currentUser && likes.includes(auth.currentUser.uid);
            const postDiv = document.createElement("div");

            postDiv.className = "post";

            postDiv.innerHTML = `
                <div class="post-user">
                    👤 ${post.name || "NEXORA User"}
                </div>

                <div class="post-text">
                    ${post.text || ""}
                </div>
<div class="post-actions">
    <button onclick="likePost('${doc.id}')">
        ${userLiked ? "❤️ Liked" : "👍 Like"}

function uploadStory() {

    const user = auth.currentUser;

    if (!user) {
        alert("Story দিতে আগে Login করুন।");
        return;
    }

    const fileInput =
        document.getElementById("storyMedia");

    const file = fileInput.files[0];

    if (!file) {
        return;
    }

    if (
        !file.type.startsWith("image/") &&
        !file.type.startsWith("video/")
    ) {

        alert("শুধু ছবি অথবা ভিডিও নির্বাচন করুন।");

        fileInput.value = "";

        return;
    }

    const status =
        document.getElementById("storyStatus");

    status.style.display = "block";

    status.innerText =
        "Story Upload হচ্ছে... ⏳";


    const mediaType =
        file.type.startsWith("video/")
            ? "video"
            : "image";


    const formData = new FormData();

    formData.append("file", file);

    formData.append(
        "upload_preset",
        "NEXORA _Reels"
    );


    const uploadType =
        mediaType === "video"
            ? "video"
            : "image";


    fetch(
        "https://api.cloudinary.com/v1_1/xnpnqatf/" +
        uploadType +
        "/upload",
        {
            method: "POST",
            body: formData
        }
    )

    .then(function(response) {

        if (!response.ok) {

            throw new Error(
                "Cloudinary Upload ব্যর্থ হয়েছে।"
            );

        }

        return response.json();

    })

    .then(function(data) {

        return db.collection("Stories").add({

            mediaUrl:
                data.secure_url,

            mediaType:
                mediaType,

            name:
                user.displayName ||
                "NEXORA User",

            email:
                user.email || "",

            uid:
                user.uid,

            createdAt:
                firebase.firestore.FieldValue
                .serverTimestamp()

        });

    })

    .then(function() {

        status.innerText =
            "Story সফলভাবে Upload হয়েছে! 🎉";

        fileInput.value = "";

        setTimeout(function() {

            status.style.display = "none";

        }, 3000);

    })

    .catch(function(error) {

        console.error(error);

        status.innerText =
            "Story Upload করা যায়নি: " +
            error.message;

    });

}

function likePost(postId) {

    const user = auth.currentUser;

    if (!user) {
        alert("Like করতে আগে Login করুন।");
        return;
    }

    const postRef = db.collection("Posts").doc(postId);

    postRef.get().then(function(doc) {

        if (likes.includes(user.uid)) {

            return postRef.update({
                likes: firebase.firestore.FieldValue.arrayRemove(user.uid)
            });

        } else {

            return postRef.update({
                likes: firebase.firestore.FieldValue.arrayUnion(user.uid)
            });

        }

    }).catch(function(error) {

        console.error(error);
        alert("Like করা যায়নি: " + error.message);

    });
}
