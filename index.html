<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#f0f2f5;
    color:#1c1e21;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginSection{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
}

.logo{
    width:150px;
    height:55px;
    margin:0 auto 20px;
    border-radius:14px;
    background:linear-gradient(135deg,#1877f2,#635bff);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    font-weight:800;
    letter-spacing:2px;
}

.login-box h2{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#65676b;
    margin-bottom:20px;
}

.login-btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#message{
    text-align:center;
    margin-top:15px;
}

/* ================= HEADER ================= */

#homeSection{
    min-height:100vh;
    padding-bottom:80px;
}

.nx-header{
    height:64px;
    background:white;
    border-bottom:1px solid #ddd;
    box-shadow:0 1px 5px rgba(0,0,0,.1);
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 15px;
    position:sticky;
    top:0;
    z-index:1000;
}

.nx-logo{
    color:#1877f2;
    font-size:28px;
    font-weight:800;
}

.nx-search{
    height:42px;
    max-width:390px;
    flex:1;
    background:#f0f2f5;
    border-radius:25px;
    display:flex;
    align-items:center;
    padding:0 16px;
    color:#65676b;
    cursor:pointer;
}

.header-buttons{
    margin-left:auto;
    display:flex;
    gap:8px;
}

.top-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#f0f2f5;
    font-size:20px;
    position:relative;
}

.badge{
    position:absolute;
    right:-2px;
    top:-3px;
    min-width:18px;
    height:18px;
    padding:2px 5px;
    border-radius:20px;
    background:#e41e3f;
    color:white;
    font-size:10px;
}

/* ================= FEED ================= */

.feed{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:10px 8px 90px;
}

.card{
    background:white;
    border-radius:15px;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.mind-row{
    display:flex;
    gap:10px;
    align-items:center;
}

.avatar{
    width:46px;
    height:46px;
    flex-shrink:0;
    border-radius:50%;
    background:linear-gradient(135deg,#1877f2,#635bff);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
}

.mind{
    flex:1;
    height:46px;
    background:#f0f2f5;
    border-radius:25px;
    display:flex;
    align-items:center;
    padding:0 17px;
    color:#65676b;
    cursor:pointer;
}

.action-row{
    display:flex;
    border-top:1px solid #eee;
    margin-top:14px;
    padding-top:8px;
}

.action-row button{
    flex:1;
    border:0;
    background:transparent;
    padding:10px 5px;
    border-radius:8px;
    font-weight:bold;
}

.action-row button:hover{
    background:#f0f2f5;
}

/* ================= STORIES ================= */

.title-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}

.title-row b{
    font-size:19px;
}

.title-row span{
    color:#1877f2;
    font-weight:bold;
    cursor:pointer;
}

.stories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
}

.stories::-webkit-scrollbar{
    display:none;
}

.story{
    width:108px;
    min-width:108px;
    height:180px;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    background:#ddd;
}

.story img,
.story video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.create-story{
    background:linear-gradient(160deg,#635bff,#1877f2);
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding-bottom:15px;
}

.plus{
    width:48px;
    height:48px;
    border-radius:50%;
    background:white;
    color:#1877f2;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    margin-bottom:7px;
}

/* ================= POSTS ================= */

.section-title{
    background:white;
    padding:15px;
    margin-top:10px;
    border-radius:14px 14px 0 0;
    font-size:18px;
    border-bottom:1px solid #eee;
}

.post{
    background:white;
    padding:14px;
    margin-bottom:13px;
    border-radius:0 0 14px 14px;
    box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.post-user{
    font-weight:bold;
    margin-bottom:8px;
}

.post-text{
    font-size:17px;
    line-height:1.55;
    white-space:pre-wrap;
    margin-bottom:10px;
}

.post-media{
    width:100%;
    max-height:600px;
    object-fit:cover;
    border-radius:10px;
    margin-top:8px;
}

.post-actions{
    display:flex;
    border-top:1px solid #eee;
    margin-top:10px;
    padding-top:7px;
}

.post-actions button{
    flex:1;
    border:0;
    background:transparent;
    padding:10px 3px;
    color:#65676b;
    font-weight:bold;
    border-radius:8px;
}

.post-actions button:hover{
    background:#f0f2f5;
}

/* ================= BOTTOM ================= */

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    background:white;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:3000;
}

.bottom-nav button{
    border:0;
    background:transparent;
    color:#555;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font-size:20px;
}

.bottom-nav small{
    font-size:11px;
}

.create-btn{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#1877f2;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:#f0f2f5;
    z-index:5000;
    overflow-y:auto;
}

.modal-header{
    height:60px;
    background:white;
    display:flex;
    align-items:center;
    padding:0 15px;
    box-shadow:0 1px 5px rgba(0,0,0,.1);
    position:sticky;
    top:0;
    z-index:5;
}

.back{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f0f2f5;
    font-size:23px;
}

.modal-container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:15px 10px 100px;
}

.create-box{
    background:white;
    border-radius:15px;
    padding:15px;
}

textarea{
    width:100%;
    min-height:150px;
    border:0;
    outline:0;
    resize:none;
    margin-top:15px;
    padding:15px;
    font-size:19px;
    border-radius:12px;
}

.extra-box{
    background:#f0f2f5;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
    font-size:14px;
}

.add-box{
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
    margin-top:15px;
}

.add-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.add-buttons button{
    border:0;
    background:#f0f2f5;
    padding:11px 13px;
    border-radius:10px;
}

.publish{
    width:100%;
    border:0;
    background:#1877f2;
    color:white;
    padding:14px;
    border-radius:10px;
    margin-top:15px;
    font-size:17px;
    font-weight:bold;
}

/* ================= SEARCH ================= */

.search-container{
    max-width:650px;
    margin:auto;
    padding:15px;
}

.search-input{
    width:100%;
    padding:14px 18px;
    border:1px solid #ddd;
    border-radius:25px;
    outline:0;
    font-size:16px;
}

.search-result{
    background:white;
    padding:14px;
    border-radius:12px;
    margin-top:10px;
}

/* ================= REELS ================= */

.reel{
    background:#000;
    color:white;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:15px;
}

.reel video{
    width:100%;
    max-height:650px;
    display:block;
    background:#000;
}

.reel-info{
    padding:12px;
}

.reel-actions{
    display:flex;
    gap:8px;
    padding:10px;
}

.reel-actions button{
    flex:1;
    border:0;
    border-radius:8px;
    padding:10px;
    background:#222;
    color:white;
}

/* ================= SETTINGS ================= */

.settings-item{
    background:white;
    padding:16px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.settings-item:first-child{
    border-radius:14px 14px 0 0;
}

.settings-item:last-child{
    border-radius:0 0 14px 14px;
}

.settings-item b{
    display:block;
}

.settings-item span{
    display:block;
    color:#65676b;
    font-size:13px;
    margin-top:4px;
}

/* ================= MOBILE ================= */

@media(max-width:699px){

    .nx-header{
        height:60px;
        padding:0 9px;
    }

    .nx-logo{
        font-size:24px;
    }

    .nx-search{
        display:flex;
        width:40px;
        flex:0 0 40px;
        padding:0;
        justify-content:center;
        font-size:0;
    }

    .nx-search::before{
        content:"🔍";
        font-size:18px;
    }

    .header-buttons{
        gap:4px;
    }

    .top-btn{
        width:38px;
        height:38px;
    }

    .feed{
        padding-left:5px;
        padding-right:5px;
    }

}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginSection">

<div class="login-box">

<div class="logo">NEXORA</div>

<h2>Login to NEXORA</h2>

<p class="subtitle">
Gmail দিয়ে নিরাপদে Login করুন
</p>

<button class="login-btn" onclick="googleLogin()">
🔐 Sign in with Google
</button>

<div id="message"></div>

</div>

</section>


<!-- ================= HOME ================= -->

<section id="homeSection" class="hidden">

<header class="nx-header">

<div class="nx-logo">NEXORA</div>

<div class="nx-search" onclick="openSearch()">
🔍 Search NEXORA
</div>

<div class="header-buttons">

<button class="top-btn" onclick="openMessenger()">
💬
<span class="badge">2</span>
</button>

<button class="top-btn" onclick="openNotifications()">
🔔
<span class="badge">3</span>
</button>

<button class="top-btn" onclick="openSettings()">
⚙️
</button>

</div>

</header>


<main class="feed">

<!-- CREATE -->

<div class="card">

<div class="mind-row">

<div class="avatar">👤</div>

<div class="mind" onclick="openCreatePost()">
What's on your mind?
</div>

</div>


<div class="action-row">

<button onclick="openCreatePost()">
📝 Post
</button>

<button onclick="selectReel()">
🎬 Reel
</button>

<button onclick="createStory()">
📷 Story
</button>

</div>

</div>


<!-- STORIES -->

<div class="card">

<div class="title-row">

<b>Stories</b>

<span onclick="alert('সব Story এখানে দেখা যাবে।')">
See all
</span>

</div>

<div class="stories">

<div class="story create-story"
onclick="createStory()">

<div class="plus">+</div>

<b>Create Story</b>

</div>

<div id="storiesFeed"></div>

</div>

</div>


<!-- POSTS -->

<div class="section-title">
📰 Posts
</div>

<div id="postsFeed"></div>

</main>


<!-- BOTTOM -->

<nav class="bottom-nav">

<button>
🏠
<small>Home</small>
</button>

<button onclick="openFriends()">
👥
<small>Friends</small>
</button>

<button onclick="openCreatePost()">
<span class="create-btn">＋</span>
<small>Create</small>
</button>

<button onclick="openReels()">
🎬
<small>Reels</small>
</button>

<button onclick="openProfile()">
👤
<small>Profile</small>
</button>

</nav>

</section>


<!-- ================= HIDDEN FILES ================= -->

<input
type="file"
id="storyFile"
accept="image/*,video/*"
style="display:none"
onchange="uploadStory()"
>

<input
type="file"
id="reelFile"
accept="video/*"
style="display:none"
onchange="uploadReel()"
>


<!-- ================= JAVASCRIPT ================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* ================= FIREBASE ================= */

const firebaseConfig = {
    apiKey:"AIzaSyBJ-HDSL70D_xMZCSjsN5ZEGz4X4BFs9jE",
    authDomain:"nexora-b1945.firebaseapp.com",
    projectId:"nexora-b1945",
    storageBucket:"nexora-b1945.firebasestorage.app",
    messagingSenderId:"443615979456",
    appId:"1:443615979456:web:82f38923fa332df6094a25"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.firestore();

const provider=
new firebase.auth.GoogleAuthProvider();


/* ================= LOGIN ================= */

function googleLogin(){

const message=
document.getElementById("message");

message.innerText=
"Google Login হচ্ছে...";

auth.signInWithPopup(provider)

.catch(function(error){

console.error(error);

message.innerText=
"Login করা যায়নি: "+error.message;

});

}


/* ================= AUTH ================= */

auth.onAuthStateChanged(function(user){

if(user){

document
.getElementById("loginSection")
.classList.add("hidden");

document
.getElementById("homeSection")
.classList.remove("hidden");

loadPosts();
loadStories();

}else{

document
.getElementById("loginSection")
.classList.remove("hidden");

document
.getElementById("homeSection")
.classList.add("hidden");

}

});


/* ================= CREATE POST ================= */

function openCreatePost(){

if(!auth.currentUser){

alert("আগে Login করুন।");

return;

}

const old=
document.getElementById("createModal");

if(old) old.remove();

const modal=
document.createElement("div");

modal.id="createModal";

modal.className="modal";

modal.innerHTML=`

<div class="modal-header">

<button class="back"
onclick="closeModal('createModal')">
←
</button>

<b style="margin-left:15px;font-size:20px">
Create Post
</b>

</div>


<div class="modal-container">

<div class="create-box">

<div>

<b>
${escapeHTML(
auth.currentUser.displayName||
"NEXORA User"
)}
</b>

<br>

<button
onclick="changePrivacy()"
id="privacyButton"
style="
border:0;
background:#f0f2f5;
padding:5px 9px;
border-radius:7px;
margin-top:5px;
">
🌍 Public ▾
</button>

</div>


<textarea
id="postText"
placeholder="What's on your mind?"
></textarea>


<div
id="postInfo"
class="extra-box hidden">
</div>


<div id="mediaPreview"></div>


<div class="add-box">

<b>Add to your post</b>

<div class="add-buttons">

<button onclick="selectPostImages()">
🖼️ Photos
</button>

<button onclick="selectPostVideo()">
🎬 Video
</button>

<button onclick="changeBackground()">
🎨 Background
</button>

<button onclick="addFeeling()">
😊 Feeling
</button>

<button onclick="addLocation()">
📍 Location
</button>

<button onclick="addTags()">
👥 Tag People
</button>

<button onclick="addMusic()">
🎵 Music
</button>

<button onclick="startLive()">
🔴 Live
</button>

</div>

</div>


<button class="publish"
onclick="publishPost()">
🚀 Post
</button>

</div>

</div>


<input
type="file"
id="postFiles"
accept="image/*,video/*"
multiple
style="display:none"
onchange="previewPostFiles()"
>

`;

document.body.appendChild(modal);

}


function closeModal(id){

const el=
document.getElementById(id);

if(el) el.remove();

}


/* ================= POST OPTIONS ================= */

let postPrivacy="Public";
let postFeeling="";
let postLocation="";
let postTags="";
let postBackground="#ffffff";
let postFiles=[];


function changePrivacy(){

const value=
prompt(
"Privacy নির্বাচন করুন:\n\n1 = Public\n2 = Friends\n3 = Only Me"
);

if(value==="1") postPrivacy="Public";
else if(value==="2") postPrivacy="Friends";
else if(value==="3") postPrivacy="Only Me";
else return;

const button=
document.getElementById("privacyButton");

if(button){

button.innerText=
postPrivacy==="Public"
?"🌍 Public ▾"
:postPrivacy==="Friends"
?"👥 Friends ▾"
:"🔒 Only Me ▾";

}

}


function addFeeling(){

const value=
prompt(
"Feeling লিখুন\nযেমন: Happy, Sad, Love"
);

if(!value)return;

postFeeling=value;

updateInfo();

}


function addLocation(){

const value=
prompt("Location লিখুন:");

if(!value)return;

postLocation=value;

updateInfo();

}


function addTags(){

const value=
prompt("যাকে Tag করবেন তার নাম লিখুন:");

if(!value)return;

postTags=value;

updateInfo();

}


function updateInfo(){

const box=
document.getElementById("postInfo");

if(!box)return;

let text="";

if(postFeeling)
text+="😊 Feeling: "+escapeHTML(postFeeling)+"<br>";

if(postLocation)
text+="📍 Location: "+escapeHTML(postLocation)+"<br>";

if(postTags)
text+="👥 Tagged: "+escapeHTML(postTags);

if(text){

box.classList.remove("hidden");

box.innerHTML=text;

}else{

box.classList.add("hidden");

}

}


function changeBackground(){

const colors=[
"#ffffff",
"#ffeaa7",
"#fab1a0",
"#81ecec",
"#74b9ff",
"#a29bfe",
"#55efc4",
"#fdcb6e"
];

postBackground=
colors[
Math.floor(Math.random()*colors.length)
];

const text=
document.getElementById("postText");

if(text)
text.style.background=postBackground;

}


function addMusic(){

alert(
"🎵 Music feature-এর interface প্রস্তুত আছে। Music library backend যুক্ত করার পর চালু হবে।"
);

}


function startLive(){

alert(
"🔴 Live feature-এর interface প্রস্তুত আছে। Live streaming backend যুক্ত করার পর চালু হবে।"
);

}


/* ================= MEDIA ================= */

function selectPostImages(){

const input=
document.getElementById("postFiles");

input.accept="image/*";

input.click();

}


function selectPostVideo(){

const input=
document.getElementById("postFiles");

input.accept="video/*";

input.multiple=false;

input.click();

}


function previewPostFiles(){

const input=
document.getElementById("postFiles");

postFiles=
Array.from(input.files||[]);

const preview=
document.getElementById("mediaPreview");

preview.innerHTML="";

postFiles.forEach(function(file){

const url=
URL.createObjectURL(file);

if(file.type.startsWith("image/")){

preview.innerHTML+=`

<img
src="${url}"
style="
width:100%;
max-height:350px;
object-fit:cover;
border-radius:10px;
margin-top:8px;
">

`;

}else{

preview.innerHTML+=`

<video
src="${url}"
controls
style="
width:100%;
max-height:400px;
background:#000;
border-radius:10px;
margin-top:8px;
">
</video>

`;

}

});

}


/* ================= PUBLISH ================= */

function publishPost(){

const user=
auth.currentUser;

if(!user){

alert("আগে Login করুন।");

return;

}

const text=
(document.getElementById("postText")?.value||"")
.trim();

if(!text && !postFiles.length){

alert(
"কিছু লিখুন অথবা ছবি/ভিডিও দিন।"
);

return;

}


/*
   এখন Post database-এ যাবে।
   Media upload/backend অংশ পরের Firebase step-এ
   নিরাপদভাবে যুক্ত করব।
*/

db.collection("Posts").add({

text:text,

name:
user.displayName||
"NEXORA User",

uid:user.uid,

privacy:postPrivacy,

feeling:postFeeling,

location:postLocation,

function loadPosts(){

document.getElementById("postsFeed");

db.collection("Posts")
.orderBy("createdAt","desc")
.onSnapshot(function(snapshot){

snapshot.forEach(function(doc){

document.createElement("div");

div.className="post";

div.innerHTML=`

<div class="post-user">

class="post-text"

post.background||"#fff"

:""
}

post.feeling

:""
}

${
post.location
?`<div>📍 ${escapeHTML(post.location)}</div>`
:""
}

${
post.taggedPeople
?`<div>👥 ${escapeHTML(post.taggedPeople)}</div>`
:""

.limit(50)
.get()
.then(function(snapshot){

results.innerHTML="";

snapshot.forEach(function(doc){

const post=doc.data();

const name=
(post.name||"").toLowerCase();

(post.text||"").toLowerCase();

name.includes(value)||
text.includes(value)

});

function sharePost(id){

const url=

if(navigator.share){

navigator.share({

title:"NEXORA",
text:"NEXORA-এর একটি Post দেখুন!",
url:url

}).catch(function(){});

}else{

?.writeText(url);

}

}

/* ================= HELPERS ================= */

function escapeHTML(value){

if(value===null||
value===undefined)
return "";

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
