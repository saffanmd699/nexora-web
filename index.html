<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
        }

        .login-box {
            width: 92%;
            max-width: 400px;
            background: white;
            padding: 30px 22px;
            border-radius: 16px;
            box-shadow: 0 4px 18px #ccc;
            text-align: center;
        }

        .logo {
            font-size: 34px;
            font-weight: bold;
            color: #1877f2;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 22px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            background: #1877f2;
            color: white;
        }

        .logout {
            margin-top: 15px;
            background: #555;
        }

        #homeSection {
            display: none;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

<div class="login-box">

    <!-- LOGIN -->
    <div id="loginSection">

        <div class="logo">NEXORA</div>

        <h2>Login to NEXORA</h2>

        <p class="subtitle">
            Gmail দিয়ে Login করুন
        </p>

        <button onclick="googleLogin()">
            Sign in with Google
        </button>

        <div id="message"></div>

    </div>


    <!-- HOME -->
    <div id="homeSection">

        <div class="logo">NEXORA</div>

        <h2>Welcome! 🎉</h2>

        <p class="subtitle">
            আপনি সফলভাবে Login করেছেন।
        </p>

        <p id="userName"></p>
        <p id="userEmail"></p>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyBJ-HDSL70D_xMZCSjsN5ZEGz4X4BFs9jE",
    authDomain: "nexora-b1945.firebaseapp.com",
    projectId: "nexora-b1945",
    storageBucket: "nexora-b1945.firebasestorage.app",
    messagingSenderId: "443615979456",
    appId: "1:443615979456:web:82f38923fa332df6094a25"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const provider = new firebase.auth.GoogleAuthProvider();


// Google Login
function googleLogin() {

    const message = document.getElementById("message");

    message.className = "";
    message.innerText = "Google Login চালু হচ্ছে...";

    auth.signInWithPopup(provider)

        .then(function(result) {

            const user = result.user;

            document.getElementById("loginSection")
                .style.display = "none";

            document.getElementById("homeSection")
                .style.display = "block";

            document.getElementById("userName")
                .innerText = "নাম: " + (user.displayName || "");

            document.getElementById("userEmail")
                .innerText = "Gmail: " + user.email;

        })

        .catch(function(error) {

            console.error(error);

            message.className = "error";

            message.innerText =
                "Login করা যায়নি: " + error.message;

        });
}


// Logout
function logout() {

    auth.signOut()
        .then(function() {

            document.getElementById("homeSection")
                .style.display = "none";

            document.getElementById("loginSection")
                .style.display = "block";

            document.getElementById("message")
                .innerText = "";

        });
}


// আগে Login করা থাকলে
auth.onAuthStateChanged(function(user) {

    if (user) {

        document.getElementById("loginSection")
            .style.display = "none";

        document.getElementById("homeSection")
            .style.display = "block";

        document.getElementById("userName")
            .innerText = "নাম: " + (user.displayName || "");

        document.getElementById("userEmail")
            .innerText = "Gmail: " + user.email;

    }

});

</script>

</body>
</html>
