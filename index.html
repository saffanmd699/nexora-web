            return;

        postsFeed.innerHTML = "";

        snapshot.forEach(function(doc) {

            const post = doc.data();

            const likes = post.likes || [];
            const likeCount = likes.length;

            const userLiked =
                auth.currentUser &&
                likes.includes(auth.currentUser.uid);

            const postDiv =
                document.createElement("div");

            postDiv.className = "post";


            // =========================
            // MEDIA
            // =========================

            let mediaHTML = "";

            if (
                post.media &&
                Array.isArray(post.media)
            ) {

                post.media.forEach(function(media) {

                    if (!media || !media.url) {
                        return;
                    }


                    // IMAGE
                    if (media.type === "image") {

                        mediaHTML += `
                            <img
                                src="${media.url}"
                                alt="NEXORA Post Image"
                                style="
                                    width:100%;
                                    max-height:500px;
                                    object-fit:cover;
                                    border-radius:12px;
                                    margin-top:10px;
                                    display:block;
                                "
                            >
                        `;

                    }


                    // VIDEO
                    else if (media.type === "video") {

                        mediaHTML += `
                            <video
                                src="${media.url}"
                                controls
                                playsinline
                                preload="metadata"
                                style="
                                    width:100%;
                                    max-height:500px;
                                    border-radius:12px;
                                    margin-top:10px;
                                    background:#000;
                                    display:block;
                                "
                            ></video>
                        `;

// ================================
// UPLOAD STORY
// ================================

function uploadStory() {

    const user = auth.currentUser;

    if (!user) {
        alert("Story দিতে আগে Login করুন।");
        return;
    }

    const fileInput =
        document.getElementById("storyMedia");

    const file = fileInput.files[0];

    if (!file) {
        return;
    }

    if (
        !file.type.startsWith("image/") &&
        !file.type.startsWith("video/")
    ) {

        alert("শুধু ছবি অথবা ভিডিও নির্বাচন করুন।");

        fileInput.value = "";

        return;
    }

    const status =
        document.getElementById("storyStatus");

    status.style.display = "block";

    status.innerText =
        "Story Upload হচ্ছে... ⏳";


    const mediaType =
        file.type.startsWith("video/")
            ? "video"
            : "image";


    const formData = new FormData();

    formData.append("file", file);

    formData.append(
        "upload_preset",
        "NEXORA _Reels"
    );


    const uploadType =
        mediaType === "video"
            ? "video"
            : "image";


    fetch(
        "https://api.cloudinary.com/v1_1/xnpnqatf/" +
        uploadType +
        "/upload",
        {
            method: "POST",
            body: formData
        }
    )

    .then(function(response) {

        if (!response.ok) {

            throw new Error(
                "Cloudinary Upload ব্যর্থ হয়েছে।"
            );

        }

        return response.json();

    })

    .then(function(data) {

        return db.collection("Stories").add({

            mediaUrl:
                data.secure_url,

            mediaType:
                mediaType,

            name:
                user.displayName ||
                "NEXORA User",

            email:
                user.email || "",

            uid:
                user.uid,

            createdAt:
                firebase.firestore.FieldValue
                .serverTimestamp()

        });

    })

    .then(function() {

        status.innerText =
            "Story সফলভাবে Upload হয়েছে! 🎉";

        fileInput.value = "";

        setTimeout(function() {

            status.style.display = "none";

        }, 3000);

    })

    .catch(function(error) {

        console.error(error);

        status.innerText =
            "Story Upload করা যায়নি: " +
            error.message;

    });

}

function likePost(postId) {

    const user = auth.currentUser;

    if (!user) {
        alert("Like করতে আগে Login করুন।");
        return;
    }

    const postRef = db.collection("Posts").doc(postId);

    postRef.get().then(function(doc) {

        const post = doc.data();
        const likes = post.likes || [];

        if (likes.includes(user.uid)) {

            return postRef.update({
                likes: firebase.firestore.FieldValue.arrayRemove(user.uid)
            });

        } else {

            return postRef.update({
                likes: firebase.firestore.FieldValue.arrayUnion(user.uid)
            });

        }

    }).catch(function(error) {

        console.error(error);
        alert("Like করা যায়নি: " + error.message);

    });
}

function likeReel(reelId) {

    const user = auth.currentUser;

    if (!user) {
        alert("Like করতে আগে Login করুন।");
        return;
    }

    const reelRef = db.collection("Reels").doc(reelId);

    reelRef.get().then(function(doc) {

        if (!doc.exists) {
            alert("Reel পাওয়া যায়নি।");
            return;
        }

        const reel = doc.data();
        const likes = reel.likes || [];

        if (likes.includes(user.uid)) {

            return reelRef.update({
                likes: firebase.firestore.FieldValue.arrayRemove(user.uid)
            });

        } else {

            return reelRef.update({
                likes: firebase.firestore.FieldValue.arrayUnion(user.uid)
            });

        }

    }).catch(function(error) {

        console.error(error);

        alert("Like করা যায়নি: " + error.message);

    });
}

function shareReel(reelId, reelName) {

        text:
            reelName +
            " এর NEXORA Reel দেখুন! 🎬",

    };

            .then(function() {

            .catch(function() {

                console.log(
                    "Share বন্ধ করা হয়েছে"

            video.style.cssText = `

        let mediaType;

        if (file.type.startsWith("image/")) {
            mediaType = "image";
        }
        else if (file.type.startsWith("video/")) {
            mediaType = "video";
        }
        else {
            return Promise.reject(
                new Error("শুধু ছবি অথবা ভিডিও নির্বাচন করুন।")
            );
        }

        const formData = new FormData();

        formData.append("file", file);

        formData.append(
            "upload_preset",
            "NEXORA _Reels"
        );

        const uploadURL =
            "https://api.cloudinary.com/v1_1/xnpnqatf/" +
            mediaType +
            "/upload";

        return fetch(
            uploadURL,
            {
                method: "POST",
                body: formData
            }
        )
        .then(function(response) {

            return response.json().then(function(data) {

                if (!response.ok) {

                    throw new Error(
                        data.error &&
                        data.error.message
                            ? data.error.message
                            : "Cloudinary Upload ব্যর্থ হয়েছে।"
                    );

                }

                return data;

            });

        })
        .then(function(data) {

            return {
                url: data.secure_url,
                type: mediaType
            };

        });

    });


    Promise.all(uploadPromises)

        .then(function(mediaFiles) {

            const postData = {

                text: text,

                name:
                    user.displayName ||
                    "NEXORA User",

                email:
                    user.email ||
                    "",

                uid:
                    user.uid,

                privacy:
                    selectedPostPrivacy,

                feeling:
                    selectedPostFeeling,

                location:
                    selectedPostLocation,

                taggedPeople:
                    selectedPostTags,

                media:
                    mediaFiles,

                createdAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            };

            return db
                .collection("Posts")
                .add(postData);

        })

        .then(function() {

            alert(
                "🎉 NEXORA-তে Post সফল হয়েছে!"
            );

            selectedPostFiles = [];

            selectedPostFeeling = "";

            selectedPostLocation = "";

            selectedPostTags = "";

            selectedPostBackground =
                "#ffffff";

            closeCreatePost();

        })

        .catch(function(error) {

            console.error(
                "NEXORA POST ERROR:",
                error
            );

            alert(
                "Post করা যায়নি:\n\n" +
                error.message
            );

        });
}

// ================================
// DELETE POST
// ================================

function deletePost(postId) {

    const user = auth.currentUser;

    if (!user) {
        alert("আগে Login করুন।");
        return;
    }

    const postRef =
        db.collection("Posts").doc(postId);

    postRef.get()
        .then(function(doc) {

            if (!doc.exists) {
                alert("Post পাওয়া যায়নি।");
                return;
            }

            const post = doc.data();

            // শুধু নিজের Post Delete করতে পারবে
            if (post.uid !== user.uid) {
                alert("আপনি এই Post Delete করতে পারবেন না।");
                return;
            }

            const confirmDelete = confirm(
                "আপনি কি এই Post টি Delete করতে চান?"
            );

            if (!confirmDelete) {
                return;
            }

            return postRef.delete();

        })
        .then(function() {

            alert("🗑️ Post সফলভাবে Delete হয়েছে!");

        })
        .catch(function(error) {

            console.error(
                "DELETE POST ERROR:",
                error
            );

            alert(
                "Post Delete করা যায়নি:\n\n" +
                error.message
            );

        });

}
// ================================
// NEXORA REELS SYSTEM
// ================================

function loadNexoraReels() {

    const container =
        document.getElementById("nexoraReelsContainer");

    if (!container) {
        return;
    }

    container.innerHTML = `
        <div style="
            text-align:center;
            padding:30px;
            color:#666;
        ">
            🎬 Reels লোড হচ্ছে...
        </div>
    `;

    db.collection("Posts")
        .orderBy("createdAt", "desc")
        .get()

        .then(function(snapshot) {

            container.innerHTML = "";

            let reelFound = false;

            snapshot.forEach(function(doc) {

                const post = doc.data();

                if (!post.media ||
                    !Array.isArray(post.media)) {
                    return;
                }

                post.media.forEach(function(media) {

                    if (media.type !== "video") {
                        return;
                    }

                    reelFound = true;

                    const reelDiv =
                        document.createElement("div");

                    reelDiv.style.cssText = `
                        background:#000;
                        margin-bottom:18px;
                        border-radius:14px;
                        overflow:hidden;
                        position:relative;
                    `;

                    reelDiv.innerHTML = `

                        <div style="
                            color:white;
                            padding:12px 15px;
                            font-size:17px;
                            font-weight:bold;
                        ">
                            👤 ${post.name || "NEXORA User"}
                        </div>

                        <video
                            src="${media.url}"
                            controls
                            playsinline
                            preload="metadata"
                            style="
                                width:100%;
                                max-height:650px;
                                display:block;
                                background:#000;
                                object-fit:contain;
                            ">
                        </video>

                        ${
                            post.text
                            ? `
                            <div style="
                                color:white;
                                padding:12px 15px;
                                font-size:16px;
                            ">
                                ${post.text}
                            </div>
                            `
                            : ""
                        }

                        <div style="
                            display:flex;
                            gap:10px;
                            padding:10px 15px 15px;
                        ">

                            <button
                                onclick="likePost('${doc.id}')"
                                style="
                                    flex:1;
                                    padding:10px;
                                    border:none;
                                    border-radius:8px;
                                    background:#222;
                                    color:white;
                                    font-size:15px;
                                "
                            >
                                ❤️ Like
                            </button>

                            <button
                                onclick="shareReel('${media.url}')"
                                style="
                                    flex:1;
                                    padding:10px;
                                    border:none;
                                    border-radius:8px;
                                    background:#222;
                                    color:white;
                                    font-size:15px;
                                "
                            >
                                ↗️ Share
                            </button>

                        </div>
                    `;

                    container.appendChild(reelDiv);

                });

            });

            if (!reelFound) {

                container.innerHTML = `
                    <div style="
                        text-align:center;
                        padding:50px 20px;
                        color:#666;
                    ">
                        🎬 এখনো কোনো Reel নেই।
                    </div>
                `;

            }

        })

        .catch(function(error) {

            console.error(
                "REELS ERROR:",
                error
            );

            container.innerHTML = `
                <div style="
                    text-align:center;
                    padding:30px;
                    color:red;
                ">
                    Reels লোড করা যায়নি।
                </div>
            `;

        });

}



// ================================
// OPEN REELS PAGE
// ================================

function openNexoraReels() {

    document.getElementById("homeSection").style.display = "none";

    document.getElementById("nexoraReelsPage").style.display = "block";

    loadNexoraReels();
}


// ================================
// CLOSE REELS PAGE
// ================================

function closeNexoraReels() {

    document.getElementById("nexoraReelsPage").style.display = "none";

    document.getElementById("homeSection").style.display = "block";
}
// ================================
// SHARE REEL
// ================================

function shareReel(url) {

    if (navigator.share) {

        navigator.share({
            title: "NEXORA Reel",
            text: "দেখুন NEXORA-এর এই Reel 🎬",
            url: url
        });

    } else {

        navigator.clipboard.writeText(url);

        alert("🔗 Reel link কপি হয়েছে!");

    }

}
