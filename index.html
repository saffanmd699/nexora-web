<style>
* {

body {
    min-height: 100vh;

}

/* NEXORA HOME */
#homeSection {
    display: none;
    width: 100%;
    min-height: 100vh;
    background: #f0f2f5;
}

/* TOP BAR */
.top-bar {
    height: 60px;
    background: white;
    display: flex;
    align-items: center;
    padding: 0 15px;
    box-shadow: 0 1px 4px #ccc;
    position: sticky;
    top: 0;
    z-index: 10;
}

.top-logo {
    font-size: 28px;
    font-weight: bold;
    color: #1877f2;
}

.search-box {
    margin-left: 15px;
    background: #f0f2f5;
    border-radius: 20px;
    padding: 10px 16px;
    color: #65676b;
    flex: 1;
    max-width: 350px;
}

/* FEED */
.feed {
    width: 95%;
    max-width: 650px;
    margin: 20px auto;
}

/* CREATE POST */
.create-post {
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 1px 4px #ddd;
    margin-bottom: 15px;
}

.post-input {
    width: 100%;
    min-height: 80px;
    background: #f0f2f5;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 13px 18px;
    color: #222;
    font-size: 16px;
    resize: vertical;
    outline: none;
    display: block;
    cursor: text;
}


/* STORIES */
.stories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin-bottom: 15px;
}

.story {
    min-width: 105px;
    height: 150px;
    background: white;
    border-radius: 12px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 10px;
    font-weight: bold;
}

/* POST */
.post {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 1px 4px #ddd;
}

.post-user {
    font-weight: bold;
    margin-bottom: 10px;
}

.post-text {
    margin-bottom: 15px;
    line-height: 1.5;
}

.post-actions {
    display: flex;
    border-top: 1px solid #eee;
    padding-top: 10px;
    gap: 5px;
}

.post-actions button {
    background: transparent;
    color: #65676b;
    padding: 10px;
    font-size: 15px;
}

/* BOTTOM NAV */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: white;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 -1px 5px #ccc;
}

.bottom-nav button {
    background: transparent;
    color: #65676b;
    padding: 5px;
    font-size: 13px;
}

@media (min-width: 700px) {
    .bottom-nav {
        max-width: 650px;
        left: 50%;
        transform: translateX(-50%);
    }
}

// Google Login
function googleLogin() {

    const message = document.getElementById("message");

    message.className = "";
    message.innerText = "Google Login চালু হচ্ছে...";

    auth.signInWithPopup(provider)

        .then(function(result) {

            const user = result.user;

            document.getElementById("loginSection")
                .style.display = "none";

            document.getElementById("homeSection")
                .style.display = "block";

            document.getElementById("userName")
                .innerText = "নাম: " + (user.displayName || "");

            document.getElementById("userEmail")
                .innerText = "Gmail: " + user.email;

        })

        .catch(function(error) {

            console.error(error);

            message.className = "error";

            message.innerText =
                "Login করা যায়নি: " + error.message;

        });
}


// Logout
function logout() {

    auth.signOut()
        .then(function() {

            document.getElementById("homeSection")
                .style.display = "none";

            document.getElementById("loginSection")
                .style.display = "block";

            document.getElementById("message")
                .innerText = "";

        });
}

    }

    db.collection("Posts").add({
        text: text,

        uid: user.uid,

    })
    .then(function() {

function sharePost(postId, postText) {

    const shareData = {
        title: "NEXORA",
        text: postText || "NEXORA-তে একটি পোস্ট দেখুন!",
        url: window.location.href
    };

    if (navigator.share) {

        navigator.share(shareData)
            .then(function() {
                console.log("Post shared successfully");
            })
            .catch(function(error) {
                console.log("Share বন্ধ করা হয়েছে");
            });

    } else {

        navigator.clipboard.writeText(
            shareData.text + "\n" + shareData.url
        )
        .then(function() {
            alert("Post-এর লিংক কপি হয়েছে! 📋");
        })
        .catch(function() {

    }

function uploadReel() {

    const user = auth.currentUser;

    if (!user) {
        alert("Reel দিতে আগে Login করুন।");
        return;
    }

    const fileInput = document.getElementById("reelVideo");
    const file = fileInput.files[0];

    if (!file) {
        alert("আগে একটি ভিডিও নির্বাচন করুন।");
        return;
    }

    if (!file.type.startsWith("video/")) {
        alert("শুধু ভিডিও ফাইল নির্বাচন করুন।");
        return;
    }

    const status = document.getElementById("reelStatus");

    status.innerText = "ভিডিও Upload হচ্ছে... ⏳";

    const formData = new FormData();

    formData.append("file", file);

    formData.append(
        "upload_preset",
        "NEXORA _Reels"
    );

    fetch(
        "https://api.cloudinary.com/v1_1/xnpnqatf/video/upload",
        {
            method: "POST",
            body: formData
        }
    )
    .then(function(response) {

        if (!response.ok) {
            throw new Error("Cloudinary Upload ব্যর্থ হয়েছে।");
        }

        return response.json();

    })
    .then(function(data) {

        console.log(data);

        return db.collection("Reels").add({

            videoUrl: data.secure_url,

            name: user.displayName || "NEXORA User",

            uid: user.uid,

            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()

        });

    })
    .then(function() {

        status.innerText =
            "Reel সফলভাবে Upload হয়েছে! 🎉";

        fileInput.value = "";

    })
    .catch(function(error) {

        console.error(error);

        status.innerText =
            "Reel Upload করা যায়নি: " + error.message;

    });
}



function likePost(postId) {

    const user = auth.currentUser;

    if (!user) {
        alert("Like করতে আগে Login করুন।");
        return;
    }

    const postRef = db.collection("Posts").doc(postId);

    postRef.get().then(function(doc) {

        const post = doc.data();
        const likes = post.likes || [];

        if (likes.includes(user.uid)) {

            return postRef.update({
                likes: firebase.firestore.FieldValue.arrayRemove(user.uid)
            });

        } else {

            return postRef.update({
                likes: firebase.firestore.FieldValue.arrayUnion(user.uid)
            });

        }

    }).catch(function(error) {

        console.error(error);
        alert("Like করা যায়নি: " + error.message);

    });
}
function showCommentBox(postId) {

    const oldBox = document.getElementById("commentBox-" + postId);

    if (oldBox) {

    }

    const box = document.createElement("div");

const post = document.querySelector(
    `button[onclick="showCommentBox('${postId}')"]`
).closest(".post");

post.appendChild(box);
}


function addComment(postId) {

    const user = auth.currentUser;

    if (!user) {
        alert("Comment করতে আগে Login করুন।");
        return;
    }

    const input = document.getElementById("commentInput-" + postId);

    const text = input.value.trim();

    if (!text) {
        alert("Comment লিখুন।");
        return;
    }

    db.collection("Posts")
        .doc(postId)
        .collection("Comments")
        .add({

            text: text,

            name: user.displayName || "NEXORA User",

            uid: user.uid,

            createdAt: firebase.firestore.FieldValue.serverTimestamp()

        })

        .then(function() {

            input.value = "";

            alert("Comment সফলভাবে হয়েছে! 💬");

        })

        .catch(function(error) {

            console.error(error);

            alert("Comment করা যায়নি: " + error.message);

        });
}
function loadComments(postId, postElement) {

    db.collection("Posts")
        .doc(postId)
        .collection("Comments")
        .orderBy("createdAt", "asc")
        .onSnapshot(function(snapshot) {

            let commentsHTML = "";
            const commentCount = snapshot.size;

            const countElement = document.getElementById(
                "commentCount-" + postId
            );

            if (countElement) {
                countElement.innerText = commentCount;
            }
            snapshot.forEach(function(doc) {

                const comment = doc.data();

                commentsHTML += `
                    <div style="
                        background:#f0f2f5;
                        padding:8px 12px;
                        margin-top:8px;
                        border-radius:10px;
                    ">
                        <b>👤 ${comment.name || "NEXORA User"}</b>
                        <div>${comment.text || ""}</div>
                    </div>
                `;
            });

            let commentsArea =
                postElement.querySelector(".comments-area");

            if (!commentsArea) {

                commentsArea = document.createElement("div");

                commentsArea.className = "comments-area";

                postElement.appendChild(commentsArea);
            }

            commentsArea.innerHTML = commentsHTML;
        });
}

function likeReel(reelId) {

    const user = auth.currentUser;

    if (!user) {
        alert("Like করতে আগে Login করুন।");
        return;
    }

    const reelRef = db.collection("Reels").doc(reelId);

    reelRef.get().then(function(doc) {

        if (!doc.exists) {
            alert("Reel পাওয়া যায়নি।");
            return;
        }

        const reel = doc.data();
        const likes = reel.likes || [];

        if (likes.includes(user.uid)) {

            return reelRef.update({
                likes: firebase.firestore.FieldValue.arrayRemove(user.uid)
            });

        } else {

            return reelRef.update({
                likes: firebase.firestore.FieldValue.arrayUnion(user.uid)
            });

        }

    }).catch(function(error) {

        console.error(error);

        alert("Like করা যায়নি: " + error.message);

    });
}

    db.collection("Reels")
        .doc(reelId)
        .collection("Comments")
        .add({

            text: text,

            name:
                user.displayName ||
                "NEXORA User",

            uid: user.uid,

            createdAt:
                firebase.firestore.FieldValue.serverTimestamp()

        })
        .then(function() {

            input.value = "";

        })
        .catch(function(error) {

            console.error(error);

            alert(
                "Comment করা যায়নি: " +
                error.message
            );

        });
}



// ================================
// LOAD REEL COMMENTS
// ================================

function loadReelComments(reelId) {

    db.collection("Reels")
        .doc(reelId)
        .collection("Comments")
        .orderBy("createdAt", "asc")
        .onSnapshot(function(snapshot) {

            const countElement =
                document.getElementById(
                    "reelCommentCount-" + reelId
                );

            if (countElement) {
                countElement.innerText = snapshot.size;
            }

            const commentsArea =
                document.getElementById(
                    "reelComments-" + reelId
                );

            if (!commentsArea) {
                return;
            }

            commentsArea.innerHTML = "";

            snapshot.forEach(function(doc) {

                const comment = doc.data();

                const commentDiv =
                    document.createElement("div");

                commentDiv.style.cssText = `
                    background:#f0f2f5;
                    padding:8px 12px;
                    margin-top:8px;
                    border-radius:10px;
                `;

                commentDiv.innerHTML = `
                    <b>
                        👤 ${comment.name || "NEXORA User"}
                    </b>

                    <div>
                        ${comment.text || ""}
                    </div>
                `;

                commentsArea.appendChild(commentDiv);

            });

        });
}

// ================================
// SHARE REEL
// ================================

function shareReel(reelId, reelName) {

    const shareData = {

        title: "NEXORA Reel",

        text:
            reelName +
            " এর NEXORA Reel দেখুন! 🎬",

        url: window.location.href

    };


    if (navigator.share) {

        navigator.share(shareData)

            .then(function() {

                console.log(
                    "Reel shared successfully"
                );

            })

            .catch(function() {

                console.log(
                    "Share বন্ধ করা হয়েছে"
                );

            });

    } else {

        navigator.clipboard.writeText(
            shareData.text +
            "\n" +
            shareData.url
        )

        .then(function() {

            alert(
                "Reel-এর লিংক কপি হয়েছে! 📋"
            );

        })

        .catch(function() {

            alert(
                "Share করা যাচ্ছে না।"
            );

        });

    }

}
