<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    background:#f0f2f5;
    color:#1c1e21;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginSection{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:400px;
}

.logo{
    width:155px;
    height:58px;
    margin:0 auto 20px;
    border-radius:15px;
    background:linear-gradient(135deg,#1877f2,#635bff);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    font-weight:800;
    letter-spacing:2px;
    box-shadow:0 5px 18px rgba(24,119,242,.25);
}

#loginSection h2{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#65676b;
    margin-bottom:20px;
}

.login-btn{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    background:#1877f2;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#message{
    margin-top:15px;
    text-align:center;
}

.error{
    color:#e41e3f;
}

/* ================= HOME ================= */

#homeSection{
    display:none;
    min-height:100vh;
    padding-bottom:80px;
}

/* ================= HEADER ================= */

.nx-header{
    height:64px;
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.98);
    border-bottom:1px solid #ddd;
    box-shadow:0 1px 6px rgba(0,0,0,.08);
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 15px;
}

.nx-logo{
    color:#1877f2;
    font-size:28px;
    font-weight:800;
}

.nx-search{
    height:42px;
    max-width:370px;
    flex:1;
    background:#f0f2f5;
    border-radius:23px;
    display:flex;
    align-items:center;
    padding:0 17px;
    color:#65676b;
    cursor:pointer;
}

.nx-header-buttons{
    margin-left:auto;
    display:flex;
    gap:8px;
    align-items:center;
}

.nx-top-btn{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:#f0f2f5;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:20px;
}

.nx-top-btn:hover{
    background:#e4e6eb;
}

/* ================= MESSENGER ================= */

.nx-messenger-circle{
    width:32px;
    height:32px;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        #00c6ff,
        #1877f2 55%,
        #7c3aed
    );
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 2px 7px rgba(24,119,242,.35);
}

.nx-messenger-mark{
    color:#00f0ff;
    font-size:17px;
    font-weight:900;
    transform:rotate(-20deg);
    line-height:1;
    text-shadow:0 0 5px rgba(0,240,255,.6);
}

.nx-badge{
    position:absolute;
    top:-2px;
    right:-2px;
    min-width:19px;
    height:19px;
    border-radius:50%;
    background:#e41e3f;
    color:white;
    border:2px solid white;
    font-size:10px;
    font-weight:bold;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ================= FEED ================= */

.nx-feed{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:10px 8px 90px;
}

.nx-card{
    background:white;
    border-radius:15px;
    border:1px solid #e4e6eb;
    padding:14px;
    margin-bottom:12px;
    box-shadow:0 2px 7px rgba(0,0,0,.06);
}

/* ================= CREATE ================= */

.nx-mind-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.nx-avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    flex-shrink:0;
    background:linear-gradient(135deg,#1877f2,#635bff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.nx-avatar img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
}

.nx-mind{
    flex:1;
    height:46px;
    border-radius:25px;
    background:#f0f2f5;
    display:flex;
    align-items:center;
    padding:0 18px;
    color:#65676b;
    cursor:pointer;
}

.nx-action-row{
    display:flex;
    border-top:1px solid #e4e6eb;
    margin-top:14px;
    padding-top:9px;
}

.nx-action-row button{
    flex:1;
    border:0;
    background:transparent;
    padding:10px 4px;
    border-radius:9px;
    font-weight:bold;
}

.nx-action-row button:hover{
    background:#f0f2f5;
}

.nx-action-row button:nth-child(1){
    color:#e41e3f;
}

.nx-action-row button:nth-child(2){
    color:#7b2cff;
}

.nx-action-row button:nth-child(3){
    color:#16a34a;
}

/* ================= STORIES ================= */

.nx-section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.nx-section-title b{
    font-size:20px;
}

.nx-section-title span{
    color:#1877f2;
    font-weight:bold;
    cursor:pointer;
}

.nx-stories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
}

.nx-stories::-webkit-scrollbar{
    display:none;
}

.nx-story-list{
    display:flex;
    gap:10px;
}

.nx-story{
    width:108px;
    min-width:108px;
    height:185px;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    background:#ddd;
    flex-shrink:0;
    box-shadow:0 2px 7px rgba(0,0,0,.15);
}

.nx-story img,
.nx-story video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.create-story{
    background:linear-gradient(160deg,#6c8cff,#1877f2);
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding-bottom:15px;
    cursor:pointer;
}

.story-plus{
    width:48px;
    height:48px;
    border-radius:50%;
    background:white;
    color:#1877f2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    margin-bottom:8px;
}

/* ================= HEADINGS ================= */

.nx-section-heading{
    background:white;
    padding:15px;
    margin-top:12px;
    border-radius:14px 14px 0 0;
    border-bottom:1px solid #ddd;
    font-size:18px;
}

/* ================= POSTS ================= */

.post{
    background:white;
    border-radius:0 0 14px 14px;
    padding:14px;
    margin-bottom:14px;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.post-user{
    font-weight:bold;
    margin-bottom:8px;
}

.post-text{
    font-size:17px;
    line-height:1.55;
    white-space:pre-wrap;
    margin-bottom:10px;
}

.post-media{
    width:100%;
    max-height:600px;
    object-fit:cover;
    border-radius:10px;
    margin-top:8px;
    display:block;
}

.post-actions{
    display:flex;
    border-top:1px solid #e4e6eb;
    margin-top:10px;
    padding-top:7px;
}

.post-actions button{
    flex:1;
    border:0;
    background:transparent;
    color:#65676b;
    font-weight:bold;
    padding:10px 4px;
    border-radius:8px;
}

.post-actions button:hover{
    background:#f0f2f5;
}

.delete-btn{
    margin-top:10px;
    border:0;
    background:#ffe5e5;
    color:#e41e3f;
    padding:9px 13px;
    border-radius:8px;
}

/* ================= COMMENTS ================= */

.comment-box{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #eee;
}

.comment-input{
    width:100%;
    border:1px solid #ddd;
    border-radius:22px;
    padding:11px 14px;
    outline:none;
}

.comment-submit{
    margin-top:8px;
    border:0;
    border-radius:8px;
    padding:9px 15px;
    background:#1877f2;
    color:white;
    font-weight:bold;
}

.comment-item{
    margin-top:8px;
    padding:9px 12px;
    background:#f0f2f5;
    border-radius:10px;
}

/* ================= BOTTOM NAV ================= */

.nx-bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    z-index:3000;
    background:rgba(255,255,255,.98);
    border-top:1px solid #ddd;
    box-shadow:0 -2px 10px rgba(0,0,0,.1);
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nx-bottom-nav button{
    border:0;
    background:transparent;
    color:#555;
    min-width:55px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    font-size:20px;
}

.nx-bottom-nav small{
    font-size:11px;
    font-weight:bold;
}

.nx-bottom-nav .active{
    color:#1877f2;
}

.nx-create-button{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#1877f2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

/* ================= MODAL ================= */

.nx-modal-page{
    position:fixed;
    inset:0;
    z-index:5000;
    background:#f0f2f5;
    overflow-y:auto;
}

.nx-modal-header{
    height:60px;
    position:sticky;
    top:0;
    z-index:10;
    background:white;
    display:flex;
    align-items:center;
    padding:0 15px;
    box-shadow:0 1px 5px rgba(0,0,0,.15);
}

.nx-back-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f0f2f5;
    font-size:23px;
}

.nx-create-container{
    max-width:650px;
    margin:auto;
    padding:15px 10px 100px;
}

.nx-create-box{
    background:white;
    border-radius:15px;
    padding:15px;
}

.nx-create-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.nx-create-user img,
.nx-create-fallback{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

.nx-create-fallback{
    background:#e4e6eb;
    display:flex;
    align-items:center;
    justify-content:center;
}

#nexoraPostText{
    width:100%;
    min-height:140px;
    margin-top:15px;
    padding:15px;
    border:0;
    outline:none;
    resize:none;
    border-radius:15px;
    font-size:19px;
}

.nx-add-box{
    margin-top:15px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
}

.nx-add-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.nx-add-buttons button{
    border:0;
    background:#f0f2f5;
    padding:11px 13px;
    border-radius:10px;
}

.nx-publish-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:17px;
    font-weight:bold;
}

/* ================= REELS ================= */

#nexoraReelsPage{
    display:none;
    position:fixed;
    inset:0;
    z-index:4000;
    background:#f0f2f5;
    overflow-y:auto;
    padding-bottom:80px;
}

.reels-container{
    max-width:650px;
    margin:auto;
    padding:10px;
}

.reel-card{
    background:#000;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:18px;
}

.reel-header{
    color:white;
    padding:12px 15px;
    font-weight:bold;
}

.reel-video{
    width:100%;
    max-height:650px;
    display:block;
    background:#000;
}

.reel-actions{
    display:flex;
    gap:8px;
    padding:10px 15px 15px;
}

.reel-actions button{
    flex:1;
    border:0;
    border-radius:8px;
    padding:10px;
    background:#222;
    color:white;
}

/* ================= MOBILE ================= */

@media(max-width:699px){

    .nx-header{
        height:60px;
        padding:0 9px;
        gap:7px;
    }

    .nx-logo{
        font-size:24px;
    }

    .nx-search{
        display:none;
    }

    .nx-header-buttons{
        gap:5px;
    }

    .nx-top-btn{
        width:39px;
        height:39px;
    }

    .nx-feed{
        padding-left:5px;
        padding-right:5px;
    }

    .nx-story{
        width:105px;
        min-width:105px;
        height:178px;
    }

    .nx-bottom-nav{
        height:64px;
    }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginSection">

    <div class="login-box">

        <div class="logo">
            NEXORA
        </div>

        <h2>Login to NEXORA</h2>

        <p class="subtitle">
            Gmail দিয়ে Login করুন
        </p>

        <button
            class="login-btn"
            onclick="googleLogin()"
        >
            Sign in with Google
        </button>

        <div id="message"></div>

    </div>

</div>


<!-- ================= HOME ================= -->

<div id="homeSection">

    <!-- HEADER -->

    <div class="nx-header">

        <div class="nx-logo">
            NEXORA
        </div>

        <div
            class="nx-search"
            onclick="openSearch()"
        >
            🔍 Search NEXORA
        </div>

        <div class="nx-header-buttons">

            <!-- CREATE -->

            <button
                class="nx-top-btn"
                onclick="openCreatePost()"
            >
                ＋
            </button>

            <!-- MESSENGER -->

            <button
                class="nx-top-btn"
                onclick="openMessenger()"
                title="Messenger"
            >
                <span class="nx-messenger-circle">
                    <span class="nx-messenger-mark">➤</span>
                </span>

                <span class="nx-badge">
                    2
                </span>
            </button>

            <!-- NOTIFICATION -->

            <button
                class="nx-top-btn"
                onclick="openNotifications()"
            >
                🔔
                <span class="nx-badge">
                    3
                </span>
            </button>

        </div>

    </div>


    <!-- FEED -->

    <div class="nx-feed">

        <!-- CREATE BOX -->

        <div class="nx-card">

            <div class="nx-mind-row">

                <div
                    id="homeAvatar"
                    class="nx-avatar"
                >
                    👤
                </div>

                <div
                    class="nx-mind"
                    onclick="openCreatePost()"
                >
                    What's on your mind?
                </div>

            </div>


            <div class="nx-action-row">

                <button
                    onclick="openCreatePost()"
                >
                    📝 Post
                </button>

                <button
                    onclick="selectHomeReel()"
                >
                    🎬 Reel
                </button>

                <button
                    onclick="createStory()"
                >
                    📷 Story
                </button>

            </div>

        </div>


        <!-- STORIES -->

        <div class="nx-card">

            <div class="nx-section-title">

                <b>
                    Stories
                </b>

                <span
                    onclick="alert('সব Story এখানে দেখানো হবে।')"
                >
                    See all
                </span>

            </div>


            <div class="nx-stories">

                <div
                    class="nx-story create-story"
                    onclick="createStory()"
                >

                    <div class="story-plus">
                        +
                    </div>

                    <b>
                        Create Story
                    </b>

                </div>

                <div
                    id="storiesFeed"
                    class="nx-story-list"
                ></div>

            </div>

        </div>


        <!-- HIDDEN STORY INPUT -->

        <input
            type="file"
            id="storyMedia"
            accept="image/*,video/*"
            hidden
            onchange="uploadStory()"
        >


        <!-- HIDDEN REEL INPUT -->

        <input
            type="file"
            id="reelVideo"
            accept="video/*"
            hidden
            onchange="uploadReel()"
        >


        <div
            id="status"
            style="
                display:none;
                text-align:center;
                padding:10px;
            "
        ></div>


        <!-- REELS -->

        <div class="nx-section-heading">
            🎬 Reels
        </div>

        <div id="reelsFeed"></div>


        <!-- POSTS -->

        <div class="nx-section-heading">
            📰 Posts
        </div>

        <div id="postsFeed"></div>

    </div>


    <!-- BOTTOM NAV -->

    <div class="nx-bottom-nav">

        <button class="active">
            <span>🏠</span>
            <small>Home</small>
        </button>

        <button
            onclick="openFriends()"
        >
            <span>👥</span>
            <small>Friends</small>
        </button>

        <button
            onclick="openCreatePost()"
        >
            <span class="nx-create-button">
                ＋
            </span>
            <small>Create</small>
        </button>

        <button
            onclick="openNexoraReels()"
        >
            <span>🎬</span>
            <small>Reels</small>
        </button>

        <button
            onclick="openProfile()"
        >
            <span>👤</span>
            <small>Profile</small>
        </button>

    </div>

</div>


<!-- ================= REELS PAGE ================= -->

<div
    id="nexoraReelsPage"
>

    <div class="nx-modal-header">

        <button
            class="nx-back-btn"
            onclick="closeNexoraReels()"
        >
            ←
        </button>

        <b
            style="
                margin-left:15px;
                font-size:21px;
            "
        >
            🎬 Reels
        </b>

    </div>

    <div
        id="nexoraReelsContainer"
        class="reels-container"
    ></div>

</div>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBJ-HDSL70D_xMZCSjsN5ZEGz4X4BFs9jE",

    authDomain:
        "nexora-b1945.firebaseapp.com",

    projectId:
        "nexora-b1945",

    storageBucket:
        "nexora-b1945.firebasestorage.app",

    messagingSenderId:
        "443615979456",

    appId:
        "1:443615979456:web:82f38923fa332df6094a25"
};


firebase.initializeApp(
    firebaseConfig
);

const db =
    firebase.firestore();

const auth =
    firebase.auth();

const provider =
    new firebase.auth.GoogleAuthProvider();


/* =====================================================
   CLOUDINARY
===================================================== */

const CLOUDINARY_CLOUD =
    "xnpnqatf";

const CLOUDINARY_PRESET =
    "NEXORA _Reels";


/* =====================================================
   GLOBAL
===================================================== */

let selectedPostFiles = [];

let selectedPostPrivacy =
    "Public";

let selectedPostBackground =
    "#ffffff";

let selectedPostFeeling =
    "";

let selectedPostLocation =
    "";

let selectedPostTags =
    "";


/* =====================================================
   LOGIN
===================================================== */

function googleLogin(){

    const message =
        document.getElementById("message");

    message.className = "";

    message.innerText =
        "Google Login চালু হচ্ছে...";

    auth.signInWithPopup(provider)
        .catch(function(error){

            console.error(error);

            message.className =
                "error";

            message.innerText =
                "Login করা যায়নি: " +
                error.message;

        });
}


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(function(user){

    const login =
        document.getElementById(
            "loginSection"
        );

    const home =
        document.getElementById(
            "homeSection"
        );

    if(user){

        login.style.display =
            "none";

        home.style.display =
            "block";

        updateHomeProfile(user);

    }else{

        login.style.display =
            "flex";

        home.style.display =
            "none";

    }

});


function updateHomeProfile(user){

    const avatar =
        document.getElementById(
            "homeAvatar"
        );

    if(
        avatar &&
        user.photoURL
    ){

        avatar.innerHTML = `
            <img src="${escapeHTML(
                user.photoURL
            )}">
        `;

    }

}


/* =====================================================
   HOME BUTTONS
===================================================== */

function openMessenger(){

    alert(
        "💬 NEXORA Messenger system প্রস্তুত করা হচ্ছে।"
    );

}


function openNotifications(){

    alert(
        "🔔 NEXORA Notifications এখানে থাকবে।"
    );

}


function openFriends(){

    alert(
        "👥 NEXORA Friends system এখানে থাকবে।"
    );

}


function openProfile(){

    const user =
        auth.currentUser;

    if(!user) return;

    alert(
        "👤 Profile\n\n" +

/* =====================================================
   LIKE REEL
===================================================== */

function likeReel(reelId){

    const user =
        auth.currentUser;

    if(!user){

        alert(
            "আগে Login করুন।"
        );

        return;
    }

    const ref =
        db.collection("Reels")
          .doc(reelId);

    db.runTransaction(
        function(transaction){

            return transaction
                .get(ref)
                .then(function(doc){

                    if(!doc.exists)
                        throw new Error(
                            "Reel পাওয়া যায়নি।"
                        );

                    const data =
                        doc.data();

                    const likes =
                        data.likes || [];

                    if(
                        likes.includes(
                            user.uid
                        )
                    ){

                        transaction.update(
                            ref,
                            {
                                likes:
                                    firebase
                                    .firestore
                                    .FieldValue
                                    .arrayRemove(
                                        user.uid
                                    )
                            }
                        );

                    }else{

                        transaction.update(
                            ref,
                            {
                                likes:
                                    firebase
                                    .firestore
                                    .FieldValue
                                    .arrayUnion(
                                        user.uid
                                    )
                            }
                        );

                    }

                });

        }
    );

}

function publishNexoraPost(){

    const user =
        auth.currentUser;

    if(!user){

        alert(
            "আগে Login করুন।"
        );

        return;
    }

    const textElement =
        document.getElementById(
            "nexoraPostText"
        );

    const text =
        textElement
        ? textElement.value.trim()
        : "";

    if(
        !text &&
        selectedPostFiles.length === 0
    ){

        alert(
            "কিছু লিখুন অথবা ছবি/ভিডিও দিন।"
        );

        return;
    }


    const button =
        document.querySelector(
            ".nx-publish-btn"
        );

    button.disabled =
        true;

    button.innerText =
        "Upload হচ্ছে...";


    const uploads =
        selectedPostFiles.map(
            function(file){

                const type =
                    file.type.startsWith(
                        "video/"
                    )
                    ? "video"
                    : "image";

                return uploadToCloudinary(
                    file,
                    type
                )
                .then(function(data){

                    return {

                        url:
                            data.secure_url,

                        type:
                            type

                    };

                });

            }
        );


    Promise.all(uploads)

    .then(function(media){

        return db
            .collection("Posts")
            .add({

                text:
                    text,

                name:
                    user.displayName ||
                    "NEXORA User",

                email:
                    user.email || "",

                uid:
                    user.uid,

                privacy:
                    selectedPostPrivacy,

                feeling:
                    selectedPostFeeling,

                location:
                    selectedPostLocation,

                taggedPeople:
                    selectedPostTags,

                background:
                    selectedPostBackground,

                media:
                    media,

                likes:[],

                createdAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            });

    })

    .then(function(){

        alert(
            "🎉 NEXORA-তে Post সফল হয়েছে!"
        );

        resetCreatePost();

        closeCreatePost();

    })

    .catch(function(error){

        console.error(error);

        alert(
            "Post করা যায়নি:\n" +
            error.message
        );

        button.disabled =
            false;

        button.innerText =
            "🚀 Post";

    });

}

                .get(ref)
                .then(function(doc){

                    if(!doc.exists)
                        throw new Error(
                            "Post পাওয়া যায়নি।"
                        );

                    const data =
                        doc.data();

                    const likes =
                        data.likes || [];

                    if(
                        likes.includes(
                            user.uid
                        )
                    ){

                        transaction.update(
                            ref,
                            {
                                likes:
                                    firebase
                                    .firestore
                                    .FieldValue
                                    .arrayRemove(
                                        user.uid
                                    )
                            }
                        );

                    }else{

                        transaction.update(
                            ref,
                            {
                                likes:
                                    firebase
                                    .firestore
                                    .FieldValue
                                    .arrayUnion(
                                        user.uid
                                    )
                            }
                        );

                    }

                });

        }
    );

}

function addComment(postId){

    const user =
        auth.currentUser;

    if(!user){

        alert(
            "আগে Login করুন।"
        );

        return;
    }


    const input =
        document.getElementById(
            "commentInput-" +
            postId
        );

    const text =
        input.value.trim();

    if(!text){

        alert(
            "Comment লিখুন।"
        );

        return;
    }


    db.collection("Posts")
      .doc(postId)
      .collection("Comments")
      .add({

        text:
            text,

        name:
            user.displayName ||
            "NEXORA User",

        uid:
            user.uid,

        createdAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

      })
      .then(function(){

        input.value = "";

      });

}


function loadComments(
    postId,
    box
){

    db.collection("Posts")
      .doc(postId)
      .collection("Comments")
      .orderBy(
          "createdAt",
          "asc"
      )
      .onSnapshot(function(snapshot){

        const area =
            box.querySelector(
                "#commentsArea-" +
                postId
            );

        if(!area) return;

        area.innerHTML = "";

        snapshot.forEach(
            function(doc){

                const comment =
                    doc.data();

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "comment-item";

                div.innerHTML = `
                    <b>
                        👤 ${escapeHTML(
                            comment.name ||
                            "NEXORA User"
                        )}
                    </b>

                    <div style="
                        margin-top:3px;
                    ">
                        ${escapeHTML(
                            comment.text ||
                            ""
                        )}
                    </div>
                `;

                area.appendChild(
                    div
                );

            }
        );

      });

}

function sharePost(postId){

    const url =
        window.location.href +
        "#post-" +
        postId;

    if(navigator.share){

        navigator.share({

            title:
                "NEXORA",

            text:
                "NEXORA-এর একটি Post দেখুন! 📰",

            url:
                url

        }).catch(function(){});

    }else{

        copyText(url);

    }

}

    if(navigator.share){

        navigator.share({

            title:
                "NEXORA Reel",

            text:
                "NEXORA-এর Reel দেখুন 🎬",

            url:
                url ||
                window.location.href

        }).catch(function(){});

    }else{

        copyText(
            url ||
            window.location.href
        );

    }

}


/* =====================================================
   DELETE POST
===================================================== */

function deletePost(postId){

    const user =
        auth.currentUser;

    if(!user) return;


    const ref =
        db.collection("Posts")
          .doc(postId);


    ref.get()
      .then(function(doc){

        if(!doc.exists)
            throw new Error(
                "Post পাওয়া যায়নি।"
            );

        const post =
            doc.data();

        if(
            post.uid !==
            user.uid
        ){

            throw new Error(
                "শুধু নিজের Post Delete করতে পারবেন।"
            );

        }


        if(
            !confirm(
                "এই Post Delete করবেন?"
            )
        ){

            return null;

        }


        return ref.delete();

      })
      .then(function(result){

        if(result === null)
            return;

        alert(
            "🗑️ Post Delete হয়েছে।"
        );

      })
      .catch(function(error){

        alert(
            error.message
        );

      });

}

/* =====================================================
   CLOUDINARY
===================================================== */

function uploadToCloudinary(
    file,
    type
){

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_PRESET
    );


    return fetch(
        "https://api.cloudinary.com/v1_1/" +
        CLOUDINARY_CLOUD +
        "/" +
        type +
        "/upload",
        {
            method:
                "POST",

            body:
                formData
        }
    )
    .then(function(response){

        return response.json()
            .then(function(data){

                if(!response.ok){

                    throw new Error(
                        data.error &&
                        data.error.message
                        ? data.error.message
                        : "Cloudinary Upload ব্যর্থ।"
                    );

                }

                return data;

            });

    });

}

/* =====================================================
   COPY
===================================================== */

function copyText(text){

    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard.writeText(
            text
        )
        .then(function(){

            alert(
                "🔗 Link কপি হয়েছে!"
            );

        });

    }else{

        prompt(
            "Link কপি করুন:",
            text
        );

    }

}


/* =====================================================
   SECURITY HELPER
===================================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    )
        return "";

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
