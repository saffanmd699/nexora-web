<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NEXORA</title>

<style>

/* =====================================================
   NEXORA BASIC RESET
   ===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:#f0f2f5;
    color:#222;
}


/* =====================================================
   MODAL PAGE
   ===================================================== */

.nx-modal-page{
    position:fixed;
    inset:0;
    z-index:99999;
    background:#f0f2f5;
    overflow-y:auto;
}

.nx-modal-header{
    position:sticky;
    top:0;
    z-index:10;
    height:60px;
    display:flex;
    align-items:center;
    padding:0 15px;
    background:#fff;
    border-bottom:1px solid #ddd;
}

.nx-back-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#f0f2f5;
    font-size:25px;
    cursor:pointer;
}


/* =====================================================
   STORY REACTION BUTTON
   ===================================================== */

.nx-story-reaction-btn{
    position:relative;
    border:0;
    background:#fff;
    border-radius:20px;
    padding:6px 9px;
    cursor:pointer;
    font-size:20px;
    transition:.2s;
}

.nx-story-reaction-btn:active{
    transform:scale(.88);
}

.nx-story-reaction-btn.nx-my-reaction{
    background:#ffe6eb;
    box-shadow:0 0 0 2px #ff1744 inset;
}

.nx-reaction-count{
    font-size:11px;
    font-weight:bold;
    margin-left:2px;
}


/* =====================================================
   STORY REACTION ANIMATION
   ===================================================== */

.nexora-reaction-animation,
.nexora-love-animation{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:9999;
}

.nexora-floating-reaction,
.nexora-love-heart{
    position:absolute;
    bottom:-50px;
    animation-name:nexoraReactionFloat;
    animation-timing-function:ease-out;
    animation-fill-mode:forwards;
    pointer-events:none;
}

.nexora-love-heart{
    animation-name:nexoraLoveFloat;
}

@keyframes nexoraReactionFloat{

    0%{
        transform:
            translateY(0)
            translateX(0)
            rotate(0deg)
        scale(.6);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
            translateY(-100vh)
            translateX(var(--reaction-drift))
            rotate(var(--reaction-rotate))
        scale(1.1);

        opacity:0;
    }
}

@keyframes nexoraLoveFloat{

    0%{
        transform:
            translateY(0)
            translateX(0)
            rotate(0deg)
        scale(.5);

        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
            translateY(-100vh)
            translateX(var(--love-drift))
            rotate(var(--love-rotate))
        scale(1.25);

        opacity:0;
    }
}


/* =====================================================
   CREATE POST
   ===================================================== */

.nx-create-container{
    max-width:650px;
    margin:auto;
    padding:15px;
}

.nx-create-box{

.nx-add-buttons{

/* =====================================================

.post,

<script>

/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

/*
   এখানে আপনার আগের Firebase Config বসাবেন।
   আপনার পুরোনো Config থাকলে সেটিই ব্যবহার করবেন।
*/

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain: "nexora-b1945.firebaseapp.com",

    projectId: "nexora-b1945",

    storageBucket: "nexora-b1945.appspot.com",

    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

    appId: "YOUR_APP_ID"

};


if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig

}


const auth =
    firebase.auth();


const db =

/* =====================================================
   CLOUDINARY CONFIG
   ===================================================== */

/*
   আপনার আগের Cloudinary Cloud Name এবং
   Upload Preset এখানে বসাবেন।
*/

const CLOUDINARY_CLOUD =
    "YOUR_CLOUDINARY_CLOUD";

const CLOUDINARY_PRESET =
    "YOUR_UPLOAD_PRESET";


/* =====================================================
   GLOBAL STORY DATA
   ===================================================== */

let nexoraStories = [];

let currentStoryIndex = 0;


/* =====================================================
   LOAD STORIES
   ===================================================== */

function loadNexoraStories(){

    db.collection("Stories")
      .orderBy(
          "createdAt",
          "desc"
      )
      .onSnapshot(

          function(snapshot){

              nexoraStories = [];

              snapshot.forEach(
                  function(doc){

                      nexoraStories.push({

                          id:doc.id,

                          ...doc.data()

                      });

                  }
              );

              renderNexoraStoryList();

          },

          function(error){

              console.error(
                  "STORIES LOAD ERROR:",
                  error
              );

          }
      );

}


/* =====================================================
   STORY LIST
   ===================================================== */

function renderNexoraStoryList(){

    const container =
        document.getElementById(
            "nexoraStories"
        );

    if(!container)
        return;

    container.innerHTML = "";

    nexoraStories.forEach(
        function(story,index){

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "nexora-story-card";

            card.style.cssText = `
                width:110px;
                height:180px;
                flex:0 0 110px;
                border-radius:14px;
                overflow:hidden;
                position:relative;
                cursor:pointer;
                background:#ddd;
            `;

            let media = "";

            if(
                story.mediaType ===
                "video"
            ){

                media = `
                    <video
                        src="${escapeHTML(
                            story.mediaUrl || ""
                        )}"
                        muted
                        playsinline
                        preload="metadata"
                        style="
                            width:100%;
                            height:100%;
                            object-fit:cover;
                        "
                    ></video>
                `;

            }else{

                media = `
                    <img
                        src="${escapeHTML(
                            story.mediaUrl || ""
                        )}"
                        style="
                            width:100%;
                            height:100%;
                            object-fit:cover;
                        "
                    >
                `;

            }

            card.innerHTML = `

                ${media}

                <div style="
                    position:absolute;
                    inset:0;
                    background:
                    linear-gradient(
                        transparent 40%,
                        rgba(0,0,0,.8)
                    );
                "></div>

                <div style="
                    position:absolute;
                    left:8px;
                    bottom:8px;
                    color:#fff;
                    font-weight:bold;
                    font-size:13px;
                    z-index:2;
                ">
                    ${escapeHTML(
                        story.name ||
                        "NEXORA User"
                    )}
                </div>

            `;

            card.onclick =
                function(){

                    currentStoryIndex =
                        index;

                    openNexoraStory(
                        index
                    );

                };

            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   OPEN STORY VIEWER
   ===================================================== */

        !nexoraStories ||

    )
        return;

    currentStoryIndex =
        index;

    const story =
        nexoraStories[index];

    const old =
        document.getElementById(
            "nexoraStoryViewer"
        );

    if(old)
        old.remove();

    const viewer =
        document.createElement(
            "div"
        );

    viewer.id =
        "nexoraStoryViewer";

    viewer.innerHTML = `

        <div style="
            position:absolute;
            top:0;
            left:0;
            right:0;
            z-index:20;
            padding:15px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            color:#fff;
        ">

            <b>
                ${escapeHTML(
                    story.name ||
                    "NEXORA User"
                )}
            </b>

            <button
                onclick="closeNexoraStory()"
                style="
                    border:0;
                    background:rgba(0,0,0,.5);
                    color:#fff;
                    width:40px;
                    height:40px;
                    border-radius:50%;
                    font-size:22px;
                "
            >
                ×
            </button>

        </div>

        <div id="nexoraStoryMedia"
             style="
                width:100%;
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
             ">
        </div>

        <div
            id="storyReactionBox-${escapeHTML(
                story.id
            )}"
            style="
                position:absolute;
                left:10px;
                right:10px;
                bottom:25px;
                z-index:30;
                display:flex;
                align-items:center;
                justify-content:center;
                gap:4px;
                flex-wrap:wrap;
            "
        >

            <button
                class="nx-story-reaction-btn"
                data-emoji="❤️"
                onclick="reactToNexoraStory('${escapeHTML(
                    story.id
                )}','❤️')"
            >
                ❤️
                <span class="nx-reaction-count"></span>
            </button>

            <button
                class="nx-story-reaction-btn"
                data-emoji="😂"
                onclick="reactToNexoraStory('${escapeHTML(
                    story.id
                )}','😂')"
            >
                😂
                <span class="nx-reaction-count"></span>
            </button>

            <button
                class="nx-story-reaction-btn"
                data-emoji="😍"
                onclick="reactToNexoraStory('${escapeHTML(
                    story.id
                )}','😍')"
            >
                😍
                <span class="nx-reaction-count"></span>
            </button>

            <button
                class="nx-story-reaction-btn"
                data-emoji="😮"
                onclick="reactToNexoraStory('${escapeHTML(
                    story.id
                )}','😮')"
            >
                😮
                <span class="nx-reaction-count"></span>
            </button>

            <button
                class="nx-story-reaction-btn"
                data-emoji="😢"
                onclick="reactToNexoraStory('${escapeHTML(
                    story.id
                )}','😢')"
            >
                😢
                <span class="nx-reaction-count"></span>
            </button>

            <button
                class="nx-story-reaction-btn"
                data-emoji="😡"
                onclick="reactToNexoraStory('${escapeHTML(
                    story.id
                )}','😡')"
            >
                😡
                <span class="nx-reaction-count"></span>
            </button>

            <button
                class="nx-story-reaction-btn"
                data-emoji="👍"
                onclick="reactToNexoraStory('${escapeHTML(
                    story.id
                )}','👍')"
            >
                👍
                <span class="nx-reaction-count"></span>
            </button>

            <button
                class="nx-story-reaction-btn"
                data-emoji="🔥"
                onclick="reactToNexoraStory('${escapeHTML(
                    story.id
                )}','🔥')"
            >
                🔥
                <span class="nx-reaction-count"></span>
            </button>

            <button
                class="nx-story-reaction-btn"
                data-emoji="🎉"
                onclick="reactToNexoraStory('${escapeHTML(
                    story.id
                )}','🎉')"
            >
                🎉
                <span class="nx-reaction-count"></span>
            </button>

            <div
                id="storyReactionTotal-${escapeHTML(
                    story.id
                )}"
                style="
                    width:100%;
                    text-align:center;
                    color:#fff;
                    font-size:12px;
                    margin-top:3px;

        </div>

    `;

    document.body.appendChild(
        viewer
    );


    const mediaArea =
        document.getElementById(
            "nexoraStoryMedia"
        );


    if(
        story.mediaType ===
        "video"
    ){

        mediaArea.innerHTML = `

            <video
                src="${escapeHTML(
                    story.mediaUrl || ""
                )}"
                autoplay
                controls
                playsinline
                style="
                    max-width:100%;
                    max-height:100%;
                    object-fit:contain;
                "
            ></video>

        `;

    }else{

        mediaArea.innerHTML = `

            <img
                src="${escapeHTML(
                    story.mediaUrl || ""
                )}"
                style="
                    max-width:100%;
                    max-height:100%;
                    object-fit:contain;
                "
            >

        `;

    }


    loadNexoraStoryReactionUI(
        story.id
    );

}


/* =====================================================
   CLOSE STORY
   ===================================================== */

function closeNexoraStory(){

    const viewer =
        document.getElementById(
            "nexoraStoryViewer"
        );

    if(viewer)
        viewer.remove();

}


/* =====================================================
   STORY REACTION
   LOVE = MAIN REACTION SYSTEM
   ===================================================== */

function reactToNexoraStory(
    storyId,
    emoji
){

    const user =
        auth.currentUser;

    if(!user){

        alert(
            "Reaction দিতে আগে Login করুন।"
        );

        return;

    }


    const ref =
        db.collection("Stories")
          .doc(storyId)
          .collection("Reactions")
          .doc(user.uid);


    ref.get()

    .then(function(doc){

        if(
            doc.exists &&
            doc.data().emoji === emoji
        ){

            return ref.delete()
                .then(function(){

                    if(emoji === "❤️"){

                        createNexoraLoveAnimation();

                    }

                });

        }


        return ref.set({

            uid:user.uid,

            emoji:emoji,

            name:
                user.displayName ||
                "NEXORA User",

            photoURL:
                user.photoURL ||
                "",

            createdAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        })

        .then(function(){

            if(emoji === "❤️"){

                createNexoraLoveAnimation();

            }else{

                createNexoraReactionAnimation(
                    emoji
                );

            }

        });

    })

    .then(function(){

        loadNexoraStoryReactionUI(
            storyId
        );

    })

    .catch(function(error){

        console.error(
            "STORY REACTION ERROR:",
            error
        );

        alert(
            "Reaction দেওয়া যায়নি।"
        );

    });

}


/* =====================================================
   LOAD STORY REACTIONS
   ===================================================== */

function loadNexoraStoryReactionUI(
    storyId
){

    const box =
        document.getElementById(
            "storyReactionBox-" +
            storyId
        );

    if(!box)
        return;


    db.collection("Stories")
      .doc(storyId)
      .collection("Reactions")
      .get()

      .then(function(snapshot){

          const counts = {

              "❤️":0,
              "😂":0,
              "😍":0,
              "😮":0,
              "😢":0,
              "😡":0,
              "👍":0,
              "🔥":0,
              "🎉":0

          };


          let myReaction = "";


          snapshot.forEach(
              function(doc){

                  const reaction =
                      doc.data();

                  const emoji =
                      reaction.emoji;


                  if(
                      Object.prototype
                      .hasOwnProperty
                      .call(
                          counts,
                          emoji
                      )
                  ){

                      counts[emoji]++;

                  }


                  if(
                      auth.currentUser &&
                      reaction.uid ===
                      auth.currentUser.uid
                  ){

                      myReaction =
                          emoji;

                  }

              }
          );


          const buttons =
              box.querySelectorAll(
                  ".nx-story-reaction-btn"
              );


          buttons.forEach(
              function(button){

                  const emoji =
                      button.dataset.emoji;


                  const count =
                      counts[emoji] || 0;


                  const countElement =
                      button.querySelector(
                          ".nx-reaction-count"
                      );


                  if(countElement){

                      countElement.innerText =
                          count > 0
                          ? count
                          : "";

                  }


                  if(
                      myReaction === emoji
                  ){

                      button.classList.add(
                          "nx-my-reaction"
                      );

                  }else{

                      button.classList.remove(
                          "nx-my-reaction"
                      );

                  }

              }
          );


          const total =
              snapshot.size;


          const totalElement =
              document.getElementById(
                  "storyReactionTotal-" +
                  storyId
              );


          if(totalElement){

              totalElement.innerText =
                  total > 0
                  ? total + " Reaction"
                  : "";

          }

      })

      .catch(function(error){

          console.error(
              "REACTION LOAD ERROR:",
              error
          );

      });

}


/* =====================================================
   NORMAL REACTION ANIMATION
   ===================================================== */

function createNexoraReactionAnimation(
    emoji
){

    const viewer =
        document.getElementById(
            "nexoraStoryViewer"
        );

    if(!viewer)
        return;


    let container =
        document.getElementById(
            "nexoraReactionAnimation"
        );


    if(!container){

        container =
            document.createElement(
                "div"
            );

        container.id =
            "nexoraReactionAnimation";

        container.className =
            "nexora-reaction-animation";

        viewer.appendChild(
            container
        );

    }


    const total =
        Math.floor(
            Math.random() * 6
        ) + 15;


    for(
        let i = 0;
        i < total;
        i++
    ){

        setTimeout(
            function(){

                createSingleNexoraReaction(
                    emoji,
                    container
                );

            },
            i * 45
        );

    }

}


/* =====================================================
   NORMAL FLOATING REACTION
   ===================================================== */

function createSingleNexoraReaction(
    emoji,
    container
){

    const reaction =
        document.createElement(
            "div"
        );


    reaction.className =
        "nexora-floating-reaction";


    reaction.innerText =
        emoji;


    const left =
        Math.random() * 80 + 10;


    const size =
        Math.random() * 20 + 28;


    const duration =
        Math.random() * 1.2 + 2.2;


    const rotate =
        Math.random() * 50 - 25;


    const drift =
        Math.random() * 160 - 80;


    reaction.style.left =
        left + "%";


    reaction.style.fontSize =
        size + "px";


    reaction.style.setProperty(
        "--reaction-drift",
        drift + "px"
    );


    reaction.style.setProperty(
        "--reaction-rotate",
        rotate + "deg"
    );


    reaction.style.animationDuration =
        duration + "s";


    container.appendChild(
        reaction
    );


    setTimeout(
        function(){

            if(
                reaction &&
                reaction.parentNode
            ){

                reaction.remove();

            }

        },
        duration * 1000 + 300
    );

}


/* =====================================================
   NEXORA LOVE BURST
   বিশেষ ❤️ LOVE ANIMATION
   ===================================================== */

function createNexoraLoveAnimation(){

    const viewer =
        document.getElementById(
            "nexoraStoryViewer"
        );

    if(!viewer)
        return;


    let container =
        document.getElementById(
            "nexoraLoveAnimation"
        );


    if(!container){

        container =
            document.createElement(
                "div"
            );

        container.id =
            "nexoraLoveAnimation";

        container.className =
            "nexora-love-animation";

        viewer.appendChild(
            container
        );

    }


    const total =
        Math.floor(
            Math.random() * 6
        ) + 25;


    for(
        let i = 0;
        i < total;
        i++
    ){

        setTimeout(
            function(){

                createNexoraSingleLove(

/* =====================================================
   LIKE REEL
   ===================================================== */

function likeReel(
    reelId
){

    const user =
        auth.currentUser;

    if(!user){

        alert(
            "আগে Login করুন।"
        );

        return;

    }


    const ref =
        db.collection("Reels")
          .doc(reelId);


    db.runTransaction(
        function(transaction){

            return transaction
                .get(ref)

                .then(
                    function(doc){

                        if(!doc.exists){

                            throw new Error(
                                "Reel পাওয়া যায়নি।"
                            );

                        }


                        const data =
                            doc.data();


                        const likes =
                            data.likes || [];


                        if(
                            likes.includes(
                                user.uid
                            )
                        ){

                            transaction.update(
                                ref,
                                {

                                    likes:
                                        firebase
                                        .firestore
                                        .FieldValue
                                        .arrayRemove(
                                            user.uid
                                        )

                                }
                            );

                        }else{

                            transaction.update(
                                ref,
                                {

                                    likes:
                                        firebase
                                        .firestore
                                        .FieldValue
                                        .arrayUnion(
                                            user.uid
                                        )

                                }
                            );

                        }

                    }
                );

        }
    )

    .catch(
        function(error){

            alert(
                "Like করা যায়নি: " +
                error.message
            );

        }
    );

}

/* =====================================================
   PUBLISH POST
   ===================================================== */

function publishNexoraPost(){

    const user =
        auth.currentUser;


    if(!user){

        alert(
            "আগে Login করুন."
        );

        return;

    }


    const textElement =
        document.getElementById(
            "nexoraPostText"
        );


    const text =
        textElement
        ? textElement.value.trim()
        : "";


    const files =
        selectedPostFiles || [];


    if(
        !text &&
        files.length === 0
    ){

        alert(
            "কিছু লিখুন অথবা ছবি/ভিডিও নির্বাচন করুন।"
        );

        return;

    }


    const button =
        document.querySelector(
            ".nx-publish-btn"
        );


    if(button){

        button.disabled =
            true;

        button.innerText =
            "Upload হচ্ছে... ⏳";

    }


    const promises =
        files.map(
            function(file){

                const type =
                    file.type.startsWith(
                        "video/"
                    )
                    ? "video"
                    : "image";


                return uploadToCloudinary(
                    file,
                    type
                )

                .then(
                    function(data){

                        return {

                            url:
                                data.secure_url,

                            type:type

                        };

                    }
                );

            }
        );


    Promise.all(
        promises
    )

    .then(
        function(media){

            return db
                .collection(
                    "Posts"
                )
                .add({

                    text:text,

                    name:
                        user.displayName ||
                        "NEXORA User",

                    email:
                        user.email ||
                        "",

                    uid:user.uid,

                    privacy:
                        selectedPostPrivacy,

                    feeling:
                        selectedPostFeeling,

                    location:
                        selectedPostLocation,

                    taggedPeople:
                        selectedPostTags,

                    background:
                        selectedPostBackground,

                    media:media,

                    likes:[],

                    createdAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                });

        }
    )

    .then(
        function(){

            alert(
                "🎉 NEXORA-তে Post সফল হয়েছে!"
            );


            resetCreatePost();

            closeCreatePost();

        }
    )

    .catch(
        function(error){

            console.error(
                error
            );


            alert(
                "Post করা যায়নি:\n\n" +
                error.message
            );


            if(button){

                button.disabled =
                    false;

                button.innerText =
                    "🚀 Post";

            }

        }
    );

}

/* =====================================================
   DELETE POST
   ===================================================== */

function deletePost(
    postId
){

    const user =
        auth.currentUser;


    if(!user){

        alert(
            "আগে Login করুন."
        );

        return;

    }


    const ref =
        db.collection(
            "Posts"
        )
        .doc(
            postId
        );


    ref.get()

    .then(
        function(doc){

            if(!doc.exists){

                throw new Error(
                    "Post পাওয়া যায়নি।"
                );

            }


            const post =
                doc.data();


            if(
                post.uid !==
                user.uid
            ){

                throw new Error(
                    "আপনি এই Post Delete করতে পারবেন না।"
                );

            }


            if(
                !confirm(
                    "আপনি কি এই Post টি Delete করতে চান?"
                )
            ){

                return null;

            }


            return ref.delete();

        }
    )

    .then(
        function(result){

            if(result === null)
                return;


            alert(
                "🗑️ Post সফলভাবে Delete হয়েছে!"
            );

        }
    )

    .catch(
        function(error){

            console.error(
                error
            );


            alert(
                error.message
            );

        }
    );

}

/* =====================================================
   CLOUDINARY
   ===================================================== */

function uploadToCloudinary(
    file,
    type
){

    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_PRESET
    );


    return fetch(

        "https://api.cloudinary.com/v1_1/" +
        CLOUDINARY_CLOUD +
        "/" +
        type +
        "/upload",

        {

            method:
                "POST",

            body:
                formData

        }

    )

    .then(
        function(response){

            return response.json()

                .then(
                    function(data){

                        if(!response.ok){

                            throw new Error(

                                data.error &&
                                data.error.message

                                ?

                                data.error.message

                                :

                                "Cloudinary Upload ব্যর্থ হয়েছে।"

                            );

                        }


                        return data;

                    }
                );

        }
    );

}


/* =====================================================
   HELPERS
   ===================================================== */

function escapeHTML(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


function copyText(
    text
){

    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard.writeText(
            text
        )

        .then(
            function(){

                alert(
                    "🔗 Link কপি হয়েছে!"
                );

            }
        )

        .catch(
            function(){

                alert(
                    "Link কপি করা যায়নি।"
                );

            }
        );

    }else{

        alert(
            text
        );

    }

}
