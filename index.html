<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#f0f2f5;
    color:#1c1e21;
}

button{
    cursor:pointer;
}

#homeSection{
    display:none;
    min-height:100vh;
    background:#f0f2f5;
    padding-bottom:75px;
    overflow-x:hidden;
}

/* ================= LOGIN ================= */

#loginSection{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:25px;
    background:#f0f2f5;
}

.login-box{
    width:100%;
    max-width:400px;
}

.logo{
    width:150px;
    height:55px;
    margin:0 auto 20px;
    background:linear-gradient(135deg,#1877f2,#4f46e5);
    color:white;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:800;
    letter-spacing:2px;
    box-shadow:0 5px 15px rgba(24,119,242,.25);
}

#loginSection h2{
    text-align:center;
    font-size:24px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#65676b;
    margin-bottom:20px;
}

#loginSection button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#message{
    margin-top:15px;
    text-align:center;
    color:#1877f2;
}

#message.error{
    color:#e41e3f;
}

/* ================= HEADER ================= */

.nx-header{
    height:64px;
    width:100%;
    background:rgba(255,255,255,.98);
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 16px;
    border-bottom:1px solid #e5e5e5;
    box-shadow:0 1px 5px rgba(0,0,0,.10);
    position:sticky;
    top:0;
    z-index:1000;
}

.nx-logo{
    color:#1877f2;
    font-size:30px;
    font-weight:800;
    white-space:nowrap;
}

.nx-search{
    height:42px;
    max-width:360px;
    background:#f0f2f5;
    border-radius:24px;
    padding:11px 18px;
    color:#65676b;
    display:flex;
    align-items:center;
    flex:1;
}

.nx-header-buttons{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:9px;
}

.nx-top-btn{
    width:43px;
    height:43px;
    background:#f0f2f5;
    border:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    font-size:20px;
    transition:.2s;
}

.nx-top-btn:active{
    transform:scale(.94);
}

.nx-top-btn:hover{
    background:#e4e6eb;
}

.nx-messenger-icon{
    width:29px;
    height:29px;
    border-radius:50%;
    background:linear-gradient(135deg,#00c6ff,#1877f2,#635bff);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    transform:rotate(-20deg);
}

.nx-badge{
    position:absolute;
    top:-3px;
    right:-3px;
    min-width:19px;
    height:19px;
    padding:0 4px;
    border-radius:50%;
    background:#e41e3f;
    color:white;
    border:2px solid white;
    font-size:10px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* ================= FEED ================= */

.nx-feed{
    width:100%;
    max-width:720px;
    margin:0 auto;
    padding:8px 10px 90px;
}

.nx-card{
    background:white;
    border-radius:16px;
    border:1px solid #e4e6eb;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
    margin-bottom:12px;
    padding:14px;
}

/* CREATE */

.nx-mind-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.nx-avatar{
    width:46px;
    height:46px;
    flex-shrink:0;
    border-radius:50%;
    background:linear-gradient(135deg,#1877f2,#6c5ce7);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.nx-mind{
    flex:1;
    height:46px;
    border:1px solid #ddd;
    border-radius:25px;
    background:#f0f2f5;
    padding:12px 18px;
    display:flex;
    align-items:center;
    color:#65676b;
    cursor:pointer;
}

.nx-action-row{
    display:flex;
    border-top:1px solid #e4e6eb;
    margin-top:14px;
    padding-top:9px;
}

.nx-action-row button{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 5px;
    font-size:14px;
    font-weight:600;
    border-radius:9px;
}

.nx-action-row button:hover{
    background:#f0f2f5;
}

.nx-action-row button:nth-child(1){color:#e41e3f}
.nx-action-row button:nth-child(2){color:#7b2cff}
.nx-action-row button:nth-child(3){color:#16a34a}

/* ================= STORIES ================= */

.nx-section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.nx-section-title b{
    font-size:20px;
}

.nx-section-title span{
    color:#1877f2;
    font-size:14px;
    font-weight:bold;
}

.nx-stories{
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
}

.nx-stories::-webkit-scrollbar{
    display:none;
}

.nx-story-list{
    display:flex;
    gap:10px;
}

.nx-story{
    min-width:108px;
    width:108px;
    height:185px;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    background:#ddd;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.nx-story img,
.nx-story video{
    width:100%;
    height:100%;
    object-fit:cover;
}

.create-story{
    background:linear-gradient(160deg,#6c8cff,#1877f2);
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    padding-bottom:15px;
}

.story-plus{
    width:48px;
    height:48px;
    border-radius:50%;
    background:white;
    color:#1877f2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    margin-bottom:8px;
}

/* ================= HEADINGS ================= */

.nx-section-heading{
    background:white;
    padding:15px 16px;
    border-radius:14px 14px 0 0;
    border-bottom:1px solid #e4e6eb;
    margin:12px 0 0;
    font-size:18px;
}

/* ================= POSTS ================= */

.post{
    background:white;
    border-radius:0 0 15px 15px;
    padding:14px;
    margin-bottom:14px;
    box-shadow:0 2px 7px rgba(0,0,0,.07);
}

.post-user{
    font-size:16px;
    font-weight:700;
    margin-bottom:8px;
}

.post-text{
    font-size:17px;
    line-height:1.55;
    margin-bottom:10px;
    white-space:pre-wrap;
}

.post-media{
    width:100%;
    max-height:600px;
    object-fit:cover;
    border-radius:10px;
    margin-top:10px;
    display:block;
}

.post-actions{
    display:flex;
    border-top:1px solid #e4e6eb;
    margin-top:10px;
    padding-top:7px;
    gap:3px;
}

.post-actions button{
    flex:1;
    border:none;
    background:transparent;
    color:#65676b;
    font-weight:600;
    padding:10px 5px;
    border-radius:8px;
}

.post-actions button:hover{
    background:#f0f2f5;
}

.delete-btn{
    margin-top:10px;
    background:#ffe5e5;
    color:#e41e3f;
    border:none;
    padding:9px 14px;
    border-radius:8px;
}

/* ================= BOTTOM NAV ================= */

.nx-bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:68px;
    background:rgba(255,255,255,.98);
    border-top:1px solid #ddd;
    box-shadow:0 -2px 10px rgba(0,0,0,.10);
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:3000;
}

.nx-bottom-nav button{
    border:none;
    background:transparent;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    color:#555;
    min-width:55px;
    font-size:20px;
}

.nx-bottom-nav button.active{
    color:#1877f2;
}

.nx-bottom-nav small{
    font-size:11px;
    font-weight:600;
}

.nx-create-button{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#1877f2;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    box-shadow:0 3px 10px rgba(24,119,242,.35);
}

/* ================= MOBILE ================= */

@media(max-width:699px){

    .nx-header{
        height:60px;
        padding:0 10px;
        gap:8px;
    }

    .nx-logo{
        font-size:25px;
    }

    .nx-search{
        display:none;
    }

    .nx-header-buttons{
        gap:5px;
    }

    .nx-top-btn{
        width:39px;
        height:39px;
    }

    .nx-feed{
        padding-left:5px;
        padding-right:5px;
    }

    .nx-card{
        border-radius:13px;
    }

    .nx-story{
        min-width:105px;
        width:105px;
        height:178px;
    }

    .post{
        border-radius:13px;
        padding:12px;
    }

    .post-text{
        font-size:16px;
    }

    .nx-bottom-nav{
        height:64px;
    }

    .nx-create-button{
        width:44px;
        height:44px;
    }
}

/* ================= CREATE POST PAGE ================= */

.nx-modal-page{
    position:fixed;
    inset:0;
    background:#f0f2f5;
    z-index:5000;
    overflow-y:auto;
}

.nx-modal-header{
    height:60px;
    background:white;
    display:flex;
    align-items:center;
    padding:0 15px;
    box-shadow:0 1px 5px rgba(0,0,0,.15);
    position:sticky;
    top:0;
    z-index:10;
}

.nx-back-btn{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:#f0f2f5;
    font-size:23px;
}

.nx-create-container{
    max-width:650px;
    margin:15px auto;
    padding:5px 10px 100px;
}

.nx-create-box{
    background:white;
    border-radius:15px;
    padding:15px;
}

.nx-create-user{
    display:flex;
    align-items:center;
    gap:10px;
}

.nx-create-user img,
.nx-create-fallback{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

.nx-create-fallback{
    background:#e4e6eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

#nexoraPostText{
    width:100%;
    min-height:140px;
    margin-top:15px;
    border:none;
    outline:none;
    resize:none;
    font-size:19px;
    padding:15px;
    border-radius:15px;
}

.nx-add-box{
    margin-top:15px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:12px;
}

.nx-add-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.nx-add-buttons button{
    border:none;
    background:#f0f2f5;
    padding:11px 13px;
    border-radius:10px;
}

.nx-publish-btn{
    width:100%;
    margin-top:15px;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#1877f2;
    color:white;
    font-size:17px;
    font-weight:bold;
}

/* ================= REELS PAGE ================= */

#nexoraReelsPage{
    display:none;
    position:fixed;
    inset:0;
    background:#f0f2f5;
    z-index:4000;
    overflow-y:auto;
    padding-bottom:80px;
}

.reels-container{
    width:100%;
    max-width:650px;
    margin:auto;
    padding:10px;
}

.reel-card{
    background:#000;
    margin-bottom:18px;
    border-radius:14px;
    overflow:hidden;
}

.reel-header{
    color:white;
    padding:12px 15px;
    font-size:17px;
    font-weight:bold;
}

.reel-video{
    width:100%;
    max-height:650px;
    display:block;
    background:#000;
    object-fit:contain;
}

.reel-text{
    color:white;
    padding:12px 15px;
    font-size:16px;
}

.reel-actions{
    display:flex;
    gap:10px;
    padding:10px 15px 15px;
}

.reel-actions button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#222;
    color:white;
}

.comment-box{
    margin-top:10px;
    border-top:1px solid #eee;
    padding-top:10px;
}

.comment-input{
    width:100%;
    padding:11px;
    border:1px solid #ddd;
    border-radius:20px;
    outline:none;
}

.comment-submit{
    margin-top:8px;
    padding:8px 16px;
    background:#1877f2;
    color:white;
    border:none;
    border-radius:8px;
}

.comment-item{
    background:#f0f2f5;
    padding:9px 12px;
    margin-top:8px;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div class="login-box">

    <div id="loginSection">

        <div class="logo">NEXORA</div>

        <h2>Login to NEXORA</h2>

        <p class="subtitle">
            Gmail দিয়ে Login করুন
        </p>

        <button onclick="googleLogin()">
            Sign in with Google
        </button>

        <div id="message"></div>

    </div>

</div>


<!-- ================= HOME ================= -->

<div id="homeSection">

    <div class="nx-header">

        <div class="nx-logo">
            NEXORA
        </div>

        <div class="nx-search">
            🔍 Search NEXORA
        </div>

        <div class="nx-header-buttons">

            <button
                class="nx-top-btn"
                onclick="openCreatePost()"
                title="Create"
            >
                ＋
            </button>

            <button
                class="nx-top-btn"
                onclick="alert('Messenger system পরবর্তী ধাপে চালু করা হবে।')"
                title="Messages"
            >
                <span class="nx-messenger-icon">➤</span>
                <span class="nx-badge">2</span>
            </button>

            <button
                class="nx-top-btn"
                onclick="alert('আপনার Notification এখানে দেখানো হবে।')"
                title="Notifications"
            >
                🔔
                <span class="nx-badge">3</span>
            </button>

        </div>

    </div>


    <div class="nx-feed">

        <!-- CREATE -->

        <div class="nx-card">

            <div class="nx-mind-row">

                <div class="nx-avatar">
                    👤
                </div>

                <div
                    id="postMind"
                    class="nx-mind"
                    onclick="openCreatePost()"
                >
                    What's on your mind?
                </div>

            </div>

            <div class="nx-action-row">

                <button onclick="openCreatePost()">
                    📝 <span>Post</span>
                </button>

                <button onclick="document.getElementById('reelVideo').click()">
                    🎬 <span>Reel</span>
                </button>

                <button onclick="createStory()">
                    📷 <span>Story</span>
                </button>

            </div>

        </div>


        <!-- STORIES -->

        <div class="nx-card">

            <div class="nx-section-title">
                <b>Stories</b>
                <span onclick="alert('সব Story এখানে দেখানো হবে।')">
                    See all
                </span>
            </div>

            <div class="nx-stories">

                <div
                    class="nx-story create-story"
                    onclick="createStory()"
                >
                    <div class="story-plus">+</div>
                    <b>Create Story</b>
                </div>

                <div
                    id="storiesFeed"
                    class="nx-story-list"
                ></div>

            </div>

        </div>


        <!-- STORY INPUT -->

        <input
            type="file"
            id="storyMedia"
            accept="image/*,video/*"
            style="display:none"
            onchange="uploadStory()"
        >

        <div
            id="storyStatus"
            style="display:none;text-align:center;padding:10px;"
        ></div>


        <!-- REEL INPUT -->

        <input
            type="file"
            id="reelVideo"
            accept="video/*"
            style="display:none"
            onchange="uploadReel()"
        >

        <div
            id="reelStatus"
            style="display:none;text-align:center;padding:10px;"
        ></div>


        <!-- REELS -->

        <div class="nx-section-heading">
            <b>🎬 Reels</b>
        </div>

        <div id="reelsFeed"></div>


        <!-- POSTS -->

        <div class="nx-section-heading">
            <b>📰 Posts</b>
        </div>

        <div id="postsFeed"></div>

    </div>


    <!-- BOTTOM NAV -->

    <div class="nx-bottom-nav">

        <button class="active">
            <span>🏠</span>
            <small>Home</small>
        </button>

        <button onclick="alert('Friends system পরবর্তী ধাপে তৈরি করা হবে।')">
            <span>👥</span>
            <small>Friends</small>
        </button>

        <button onclick="openCreatePost()">
            <span class="nx-create-button">＋</span>
            <small>Create</small>
        </button>

        <button onclick="openNexoraReels()">
            <span>🎬</span>
            <small>Reels</small>
        </button>

        <button onclick="alert('Profile system পরবর্তী ধাপে তৈরি করা হবে।')">
            <span>👤</span>
            <small>Profile</small>
        </button>

    </div>

</div>


<!-- ================= REELS PAGE ================= -->

<div id="nexoraReelsPage">

    <div class="nx-modal-header">

        <button
            class="nx-back-btn"
            onclick="closeNexoraReels()"
        >
            ←
        </button>

        <b style="margin-left:15px;font-size:21px;">
            🎬 Reels
        </b>

    </div>

    <div
        id="nexoraReelsContainer"
        class="reels-container"
    ></div>

</div>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyBJ-HDSL70D_xMZCSjsN5ZEGz4X4BFs9jE",
    authDomain: "nexora-b1945.firebaseapp.com",
    projectId: "nexora-b1945",
    storageBucket: "nexora-b1945.firebasestorage.app",
    messagingSenderId: "443615979456",
    appId: "1:443615979456:web:82f38923fa332df6094a25"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

const provider =
    new firebase.auth.GoogleAuthProvider();

const CLOUDINARY_CLOUD =
    "xnpnqatf";

const CLOUDINARY_PRESET =
    "NEXORA _Reels";


/* ================= LOGIN ================= */

function googleLogin(){

    const message =
        document.getElementById("message");

    message.className = "";
    message.innerText =
        "Google Login চালু হচ্ছে...";

    auth.signInWithPopup(provider)

        .catch(function(error){

            console.error(error);

            message.className = "error";

            message.innerText =
                "Login করা যায়নি: " +
                error.message;

        });
}


/* ================= LOGOUT ================= */

function logout(){

    auth.signOut()
        .catch(function(error){

            console.error(error);

            alert(
                "Logout করা যায়নি: " +
                error.message
            );

        });

}


/* ================= AUTH STATE ================= */

auth.onAuthStateChanged(function(user){

    const login =
        document.getElementById("loginSection");

    const home =
        document.getElementById("homeSection");

    if(user){

        login.style.display = "none";
        home.style.display = "block";

        const message =
            document.getElementById("message");

        if(message){
            message.innerText = "";
        }

    }else{

        login.style.display = "flex";
        home.style.display = "none";

    }

});


/* ================= POSTS ================= */

function loadPosts(){

    db.collection("Posts")
        .orderBy("createdAt","desc")
        .onSnapshot(function(snapshot){

            const feed =
                document.getElementById("postsFeed");

            if(!feed) return;

            feed.innerHTML = "";

            snapshot.forEach(function(doc){

                const post =
                    doc.data();

                const likes =
                    post.likes || [];

                const currentUser =
                    auth.currentUser;

                const liked =
                    currentUser &&
                    likes.includes(currentUser.uid);

                const postDiv =
                    document.createElement("div");

                postDiv.className = "post";

                let mediaHTML = "";

                if(
                    post.media &&
                    Array.isArray(post.media)
                ){

                    post.media.forEach(function(media){

                        if(!media || !media.url)
                            return;

/* ================= LIKE POST ================= */

function likePost(postId){

    const user =
        auth.currentUser;

    if(!user){
        alert("আগে Login করুন।");
        return;
    }

    const ref =
        db.collection("Posts")
          .doc(postId);

    db.runTransaction(function(transaction){

        return transaction.get(ref)
            .then(function(doc){

                if(!doc.exists)
                    throw new Error("Post পাওয়া যায়নি।");

                const data =
                    doc.data();

                const likes =
                    data.likes || [];

                if(likes.includes(user.uid)){

                    transaction.update(ref,{
                        likes:
                            firebase.firestore
                            .FieldValue
                            .arrayRemove(user.uid)
                    });

                }else{

                    transaction.update(ref,{
                        likes:
                            firebase.firestore
                            .FieldValue
                            .arrayUnion(user.uid)
                    });

                }

            });

    }).catch(function(error){

        console.error(error);

        alert(
            "Like করা যায়নি: " +
            error.message
        );

    });

}

function uploadStory(){

    const user =
        auth.currentUser;

    if(!user){
        alert("আগে Login করুন।");
        return;
    }

    const input =
        document.getElementById(
            "storyMedia"
        );

    const file =
        input.files[0];

    if(!file) return;

    if(
        !file.type.startsWith("image/") &&
        !file.type.startsWith("video/")
    ){

        alert(
            "শুধু ছবি অথবা ভিডিও নির্বাচন করুন।"
        );

        input.value = "";

        return;

    const status =
        document.getElementById(
            "storyStatus"
        );

    status.style.display = "block";
    status.innerText =
        "Story Upload হচ্ছে... ⏳";

    const type =
        file.type.startsWith("video/")
        ? "video"
        : "image";

    uploadToCloudinary(file,type)

        .then(function(data){

            return db
                .collection("Stories")
                .add({

                    mediaUrl:
                        data.secure_url,

                    mediaType:type,

                    name:
                        user.displayName ||
                        "NEXORA User",

                    email:
                        user.email || "",

                    uid:user.uid,

                    createdAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                });

        })

        .then(function(){

            status.innerText =
                "Story সফলভাবে Upload হয়েছে! 🎉";

            input.value = "";

            setTimeout(function(){

                status.style.display =
                    "none";

            },3000);

        })

        .catch(function(error){

            console.error(error);

            status.innerText =
                "Story Upload করা যায়নি: " +
                error.message;

        });

}

                width:100%;
                max-height:350px;
                object-fit:cover;
                border-radius:10px;
            `;

            box.appendChild(img);

        }else{

            const video =
                document.createElement("video");

            video.src = url;

            video.controls = true;

            video.style.cssText = `
                width:100%;
                max-height:400px;
                border-radius:10px;
                background:#000;
            `;

            box.appendChild(video);

        }

        preview.appendChild(box);

    });

}

/* ================= PUBLISH POST ================= */

function publishNexoraPost(){

    const user =
        auth.currentUser;

    if(!user){

        alert("আগে Login করুন.");
        return;

    }

    const textElement =
        document.getElementById(
            "nexoraPostText"
        );

    const text =
        textElement
        ? textElement.value.trim()
        : "";

    const files =
        selectedPostFiles || [];

    if(
        !text &&
        files.length === 0
    ){

        alert(
            "কিছু লিখুন অথবা ছবি/ভিডিও নির্বাচন করুন।"
        );

        return;

    }

    const button =
        document.querySelector(
            ".nx-publish-btn"
        );

    if(button){

        button.disabled = true;
        button.innerText =
            "Upload হচ্ছে... ⏳";

    }

    const promises =
        files.map(function(file){

            const type =
                file.type.startsWith("video/")
                ? "video"
                : "image";

            return uploadToCloudinary(
                file,
                type
            )
            .then(function(data){

                return {
                    url:
                        data.secure_url,

                    type:type
                };

            });

        });

    Promise.all(promises)

        .then(function(media){

            return db
                .collection("Posts")
                .add({

                    text:text,

                    name:
                        user.displayName ||
                        "NEXORA User",

                    email:
                        user.email || "",

                    uid:user.uid,

                    privacy:
                        selectedPostPrivacy,

                    feeling:
                        selectedPostFeeling,

                    location:
                        selectedPostLocation,

                    taggedPeople:
                        selectedPostTags,

                    background:
                        selectedPostBackground,

                    media:media,

                    likes:[],

                    createdAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                });

        })

        .then(function(){

            alert(
                "🎉 NEXORA-তে Post সফল হয়েছে!"
            );

            resetCreatePost();

            closeCreatePost();

        })

        .catch(function(error){

            console.error(error);

            alert(
                "Post করা যায়নি:\n\n" +
                error.message
            );

            if(button){

                button.disabled = false;

                button.innerText =
                    "🚀 Post";

            }

        });

}


function resetCreatePost(){

    selectedPostFiles = [];

    selectedPostFeeling = "";

    selectedPostLocation = "";

    selectedPostTags = "";

    selectedPostPrivacy =
        "Public";

    selectedPostBackground =
        "#ffffff";

}


/* ================= DELETE POST ================= */

function deletePost(postId){

    const user =
        auth.currentUser;

    if(!user){

        alert("আগে Login করুন.");
        return;

    }

    const ref =
        db.collection("Posts")
          .doc(postId);

    ref.get()

        .then(function(doc){

            if(!doc.exists){

                throw new Error(
                    "Post পাওয়া যায়নি।"
                );

            }

            const post =
                doc.data();

            if(post.uid !== user.uid){

                throw new Error(
                    "আপনি এই Post Delete করতে পারবেন না।"
                );

            }

            if(
                !confirm(
                    "আপনি কি এই Post টি Delete করতে চান?"
                )
            ){

                return null;

            }

            return ref.delete();

        })

        .then(function(result){

            if(result === null)
                return;

            alert(
                "🗑️ Post সফলভাবে Delete হয়েছে!"
            );

        })

        .catch(function(error){

            console.error(error);

            alert(
                error.message
            );

        });

}

function loadNexoraReels(){

    const container =
        document.getElementById(
            "nexoraReelsContainer"
        );

    if(!container) return;

    container.innerHTML = `
        <div style="
            text-align:center;
            padding:30px;
            color:#666;
        ">
            🎬 Reels লোড হচ্ছে...
        </div>
    `;

    db.collection("Reels")
      .orderBy("createdAt","desc")
      .get()

      .then(function(snapshot){

        container.innerHTML = "";

        if(snapshot.empty){

            container.innerHTML = `
                <div style="
                    text-align:center;
                    padding:50px 20px;
                    color:#666;
                ">
                    🎬 এখনো কোনো Reel নেই।
                </div>
            `;

            return;

        }

        snapshot.forEach(function(doc){

            const reel =
                doc.data();

            const likes =
                reel.likes || [];

            const user =
                auth.currentUser;

            const liked =
                user &&
                likes.includes(user.uid);

            const div =
                document.createElement("div");

            div.className =
                "reel-card";

            div.innerHTML = `

                <div class="reel-header">
                    👤 ${escapeHTML(
                        reel.name ||
                        "NEXORA User"
                    )}
                </div>

                <video
                    class="reel-video"
                    src="${escapeHTML(
                        reel.videoUrl || ""
                    )}"
                    controls
                    playsinline
                    preload="metadata"
                ></video>

                <div class="reel-actions">

                    <button
                        onclick="likeReel('${doc.id}')"
                    >
                        ${
                            liked
                            ? "❤️ Liked"
                            : "👍 Like"
                        }
                        ${likes.length}
                    </button>

                    <button
                        onclick="shareReel('${escapeHTML(
                            reel.videoUrl || ""
                        )}')"
                    >
                        ↗️ Share
                    </button>

                </div>

            `;

            container.appendChild(div);

        });

      })

      .catch(function(error){

        console.error(error);

        container.innerHTML = `
            <div style="
                text-align:center;
                padding:30px;
                color:red;
            ">
                Reels লোড করা যায়নি।
            </div>
        `;

      });

}


/* ================= CLOUDINARY ================= */

function uploadToCloudinary(
    file,
    type
){

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    formData.append(
        "upload_preset",
        CLOUDINARY_PRESET
    );

    return fetch(
        "https://api.cloudinary.com/v1_1/" +
        CLOUDINARY_CLOUD +
        "/" +
        type +
        "/upload",
        {
            method:"POST",
            body:formData
        }
    )

    .then(function(response){

        return response.json()
            .then(function(data){

                if(!response.ok){

                    throw new Error(
                        data.error &&
                        data.error.message
                        ? data.error.message
                        : "Cloudinary Upload ব্যর্থ হয়েছে।"
                    );

                }

                return data;

            });

    });

}


/* ================= HELPERS ================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined)
        return "";

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function copyText(text){

    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard.writeText(text)
            .then(function(){

                alert(
                    "🔗 Link কপি হয়েছে!"
                );

            })
            .catch(function(){

                alert(
                    "Link কপি করা যায়নি।"
                );

            });

    }else{

        alert(text);

    }

}
