<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA Login</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #f0f2f5;
}

/* NEXORA HOME */
#homeSection {
    display: none;
    width: 100%;
    min-height: 100vh;
    background: #f0f2f5;
}

/* TOP BAR */
.top-bar {
    height: 60px;
    background: white;
    display: flex;
    align-items: center;
    padding: 0 15px;
    box-shadow: 0 1px 4px #ccc;
    position: sticky;
    top: 0;
    z-index: 10;
}

.top-logo {
    font-size: 28px;
    font-weight: bold;
    color: #1877f2;
}

.search-box {
    margin-left: 15px;
    background: #f0f2f5;
    border-radius: 20px;
    padding: 10px 16px;
    color: #65676b;
    flex: 1;
    max-width: 350px;
}

/* FEED */
.feed {
    width: 95%;
    max-width: 650px;
    margin: 20px auto;
}

/* CREATE POST */
.create-post {
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 1px 4px #ddd;
    margin-bottom: 15px;
}

.post-input {
    background: #f0f2f5;
    border-radius: 22px;
    padding: 13px 18px;
    color: #65676b;
}

/* STORIES */
.stories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin-bottom: 15px;
}

.story {
    min-width: 105px;
    height: 150px;
    background: white;
    border-radius: 12px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 10px;
    font-weight: bold;
}

/* POST */
.post {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 1px 4px #ddd;
}

.post-user {
    font-weight: bold;
    margin-bottom: 10px;
}

.post-text {
    margin-bottom: 15px;
    line-height: 1.5;
}

.post-actions {
    display: flex;
    border-top: 1px solid #eee;
    padding-top: 10px;
    gap: 5px;
}

.post-actions button {
    background: transparent;
    color: #65676b;
    padding: 10px;
    font-size: 15px;
}

/* BOTTOM NAV */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: white;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 -1px 5px #ccc;
}

.bottom-nav button {
    background: transparent;
    color: #65676b;
    padding: 5px;
    font-size: 13px;
}

@media (min-width: 700px) {
    .bottom-nav {
        max-width: 650px;
        left: 50%;
        transform: translateX(-50%);
    }
}
</style>
</head>

<body>

<div class="login-box">

    <!-- LOGIN -->
    <div id="loginSection">

        <div class="logo">NEXORA</div>

        <h2>Login to NEXORA</h2>

        <p class="subtitle">
            Gmail দিয়ে Login করুন
        </p>

        <button onclick="googleLogin()">
            Sign in with Google
        </button>

        <div id="message"></div>

    </div>


 <!-- HOME / NEXORA SOCIAL FEED -->
<div id="homeSection">

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="top-logo">NEXORA</div>
        <div class="search-box">🔍 Search NEXORA</div>
    </div>

    <!-- FEED -->
    <div class="feed">

        <!-- STORIES -->
        <div class="stories">
            <div class="story">➕<br>Create Story</div>
            <div class="story">👤<br>Story 1</div>
            <div class="story">👤<br>Story 2</div>
            <div class="story">👤<br>Story 3</div>
        </div>

        <!-- CREATE POST -->
<div class="create-post">

    <textarea
        id="postText"
        class="post-input"
        placeholder="What's on your mind?"
        rows="3"></textarea>

    <button onclick="createPost()">
        Post
    </button>

</div>
        </div>

        <!-- POST -->
        <div class="post">

            <div class="post-user">
                👤 <span id="userName">NEXORA User</span>
            </div>

            <div class="post-text">
                NEXORA-এ আপনাকে স্বাগতম! 🎉
                <br>
                আপনার বন্ধুদের সাথে যুক্ত হন এবং আপনার মুহূর্ত শেয়ার করুন।
            </div>

            <div class="post-actions">
                <button>👍 Like</button>
                <button>💬 Comment</button>
                <button>↗️ Share</button>
            </div>

        </div>

    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">

        <button>🏠<br>Home</button>

        <button>👥<br>Friends</button>

        <button>💬<br>Messages</button>

        <button>🔔<br>Notifications</button>

        <button onclick="logout()">🚪<br>Logout</button>

    </div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

const firebaseConfig = {
    apiKey: "AIzaSyBJ-HDSL70D_xMZCSjsN5ZEGz4X4BFs9jE",
    authDomain: "nexora-b1945.firebaseapp.com",
    projectId: "nexora-b1945",
    storageBucket: "nexora-b1945.firebasestorage.app",
    messagingSenderId: "443615979456",
    appId: "1:443615979456:web:82f38923fa332df6094a25"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const provider = new firebase.auth.GoogleAuthProvider();


// Google Login
function googleLogin() {

    const message = document.getElementById("message");

    message.className = "";
    message.innerText = "Google Login চালু হচ্ছে...";

    auth.signInWithPopup(provider)

        .then(function(result) {

            const user = result.user;

            document.getElementById("loginSection")
                .style.display = "none";

            document.getElementById("homeSection")
                .style.display = "block";

            document.getElementById("userName")
                .innerText = "নাম: " + (user.displayName || "");

            document.getElementById("userEmail")
                .innerText = "Gmail: " + user.email;

        })

        .catch(function(error) {

            console.error(error);

            message.className = "error";

            message.innerText =
                "Login করা যায়নি: " + error.message;

        });
}


// Logout
function logout() {

    auth.signOut()
        .then(function() {

            document.getElementById("homeSection")
                .style.display = "none";

            document.getElementById("loginSection")
                .style.display = "block";

            document.getElementById("message")
                .innerText = "";

        });
}


// আগে Login করা থাকলে
auth.onAuthStateChanged(function(user) {

    if (user) {

        document.getElementById("loginSection")
            .style.display = "none";

        document.getElementById("homeSection")
            .style.display = "block";

        document.getElementById("userName")
            .innerText = "নাম: " + (user.displayName || "");

        document.getElementById("userEmail")
            .innerText = "Gmail: " + user.email;

    }

});
function createPost() {

    const text = document.getElementById("postText").value.trim();

    if (!text) {
        alert("কিছু লিখে পোস্ট করুন।");
        return;
    }

    const user = auth.currentUser;

    if (!user) {
        alert("আগে Login করুন।");
        return;
    }

    db.collection("Posts").add({
        text: text,
        name: user.displayName || "NEXORA User",
        email: user.email,
        uid: user.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(function() {

        document.getElementById("postText").value = "";

        alert("Post সফলভাবে করা হয়েছে! 🎉");

    })
    .catch(function(error) {

        console.error(error);

        alert("Post করা যায়নি: " + error.message);

    });
}
</script>

</body>
</html>
